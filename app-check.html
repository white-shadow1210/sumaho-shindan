<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アプリ利用状況チェック｜スマホの相談士</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #249496;
  --primary-d: #1b7a7c;
  --bg: #F5F3EE;
  --white: #ffffff;
  --text: #2d3748;
  --muted: #718096;
  --used-bg: #EBF5FF; --used-b: #0078D4;
  --trans-bg: #FFF2EB; --trans-b: #E05A00;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; overflow: hidden; font-family: ‘Noto Sans JP’, sans-serif; background: var(–bg); }

/* ── 固定レイアウト構造 ── */
.page { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

/* ヘッダー */
.hdr { background: var(–primary); color: white; padding: 8px 14px 10px; flex-shrink: 0; }
.hdr h1 { font-size: 0.88rem; font-weight: 900; margin-bottom: 2px; }
.hdr-sub { font-size: 0.62rem; opacity: 0.85; margin-bottom: 6px; }
.legend { display: flex; gap: 7px; flex-wrap: wrap; }
.lgd-item { display: flex; align-items: center; gap: 3px; font-size: 0.6rem; font-weight: 700;
background: rgba(255,255,255,0.18); border-radius: 20px; padding: 3px 7px; color: white; }
.lgd-dot { width: 7px; height: 7px; border-radius: 50%; }

/* カウンター */
.counter { background: var(–white); border-bottom: 1px solid #eee;
padding: 5px 14px; display: flex; gap: 10px; align-items: center;
font-size: 0.68rem; font-weight: 700; color: var(–muted); flex-shrink: 0; }
.cnt-n { font-size: 0.95rem; font-weight: 900; color: var(–primary); }
.cnt-n.red { color: #E05A00; }

/* ── スクロールエリア ── */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 7px 9px; }

/* カテゴリブロック */
.cat { background: var(–white); border-radius: 12px; overflow: hidden;
margin-bottom: 7px; box-shadow: 0 1px 5px rgba(0,0,0,0.07); }
.cat-hdr { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
font-size: 0.72rem; font-weight: 700; border-bottom: 1px solid rgba(0,0,0,0.04); }
.cat-cnt { margin-left: auto; font-size: 0.56rem; font-weight: 700;
color: white; padding: 2px 6px; border-radius: 20px; }

/* グリッド */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 5px; padding: 7px; }

/* アプリボタン */
.app { display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
padding: 6px 3px 5px; border-radius: 12px; border: 3px solid transparent;
background: #F8F8F8; cursor: pointer; position: relative; user-select: none;
aspect-ratio: 1 / 1.22;
transition: border-color .18s, background .18s, box-shadow .18s; }
.app.used  {
background: var(–used-bg);
border: 4px solid var(–used-b);
outline: 2px solid rgba(0,120,212,0.2);
box-shadow: 0 0 0 3px rgba(0,120,212,0.12), 0 3px 10px rgba(0,120,212,0.28);
}
.app.trans {
background: var(–trans-bg);
border: 4px solid var(–trans-b);
outline: 2px solid rgba(224,90,0,0.2);
box-shadow: 0 0 0 3px rgba(224,90,0,0.12), 0 3px 10px rgba(224,90,0,0.28);
}

@keyframes bnc {
0%{transform:scale(1)} 30%{transform:scale(.82)} 65%{transform:scale(1.1)} 85%{transform:scale(.96)} 100%{transform:scale(1)}
}
.app.bnc { animation: bnc .28s ease; }

/* バッジ */
.bdg { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px;
border-radius: 50%; display: none; align-items: center; justify-content: center;
font-size: .5rem; font-weight: 900; color: white; line-height: 1; }
.app.used  .bdg { display: flex; background: var(–used-b); }
.app.trans .bdg { display: flex; background: var(–trans-b); }

/* ★ アイコンラッパー（44×44px） */
.ico {
width: 44px; height: 44px; border-radius: 10px; overflow: hidden;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0; margin-bottom: 4px; background: #F0F0F0;
}
/* ★ 実アイコン画像 */
.ico img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; display: block; }
/* ★ 絵文字フォールバック */
.ico .emo { font-size: 1.42rem; line-height: 1; }

.aname { font-size: .52rem; font-weight: 700; text-align: center;
line-height: 1.18; word-break: break-all; color: var(–text); }
.app.used  .aname { color: #0056A0; }
.app.trans .aname { color: #C44800; }

/* 送信ボタン */
.submit-bar { flex-shrink: 0; background: var(–white); border-top: 1px solid #eee;
padding: 9px 13px; padding-bottom: max(9px, env(safe-area-inset-bottom)); }
.sbtn { display: block; width: 100%; max-width: 420px; margin: 0 auto; padding: 12px;
background: var(–primary); color: white; border: none; border-radius: 12px;
font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
letter-spacing: .04em; box-shadow: 0 3px 10px rgba(36,148,150,.32);
transition: background .2s, transform .1s; }
.sbtn:active { background: var(–primary-d); transform: scale(.97); }
.sbtn:disabled { background: #aac6c6; box-shadow: none; }

/* 完了オーバーレイ */
.overlay { display: none; position: fixed; inset: 0; z-index: 999;
background: rgba(36,148,150,.95); flex-direction: column;
align-items: center; justify-content: center; color: white; padding: 24px; text-align: center; }
.overlay.show { display: flex; animation: fi .3s; }
@keyframes fi { from{opacity:0} to{opacity:1} }
.ov-em  { font-size: 3.2rem; margin-bottom: 10px; }
.ov-ttl { font-size: 1.3rem; font-weight: 900; margin-bottom: 6px; }
.ov-sub { font-size: .82rem; opacity: .85; margin-bottom: 16px; }
.ov-sum { background: rgba(255,255,255,.15); border-radius: 10px;
padding: 11px 15px; width: 100%; max-width: 300px;
font-size: .78rem; line-height: 1.8; margin-bottom: 18px; text-align: left; }
.ov-cls { background: white; color: var(–primary); border: none; border-radius: 10px;
padding: 11px 32px; font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; }
</style>

</head>
<body>
<div class="page">

  <div class="hdr">
    <h1>📱 アプリ利用状況チェック</h1>
    <div class="hdr-sub">スマホの相談士｜データ移行サポート事前確認</div>
    <div class="legend">
      <div class="lgd-item"><div class="lgd-dot" style="background:#0078D4"></div>1回：利用中</div>
      <div class="lgd-item"><div class="lgd-dot" style="background:#E05A00"></div>2回：移行必須</div>
      <div class="lgd-item"><div class="lgd-dot" style="background:rgba(255,255,255,.4)"></div>3回：解除</div>
    </div>
  </div>

  <div class="counter">
    利用中 <span class="cnt-n" id="cu">0</span> 件
    &nbsp;&nbsp;移行必須 <span class="cnt-n red" id="ct">0</span> 件
  </div>

  <div class="scroll" id="con"></div>

  <div class="submit-bar">
    <button class="sbtn" id="sbtn" onclick="send()">カルテに記録して送信する →</button>
  </div>
</div>

<div class="overlay" id="ov">
  <div class="ov-em">✅</div>
  <div class="ov-ttl">送信完了！</div>
  <div class="ov-sub">アプリ情報をカルテに記録しました。<br>担当スタッフが事前確認します。</div>
  <div class="ov-sum" id="osum"></div>
  <button class="ov-cls" onclick="closeOv()">閉じる</button>
</div>

<script>
/* ============================================================
   GAS URL
============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzA_XYi3s38MCWJ2TunMA5J6Z1PNxlMD7k6gKKoUtcdxRUB3D8rQnvtaZBQeUrrYxc/exec';

/* ============================================================
   ★ APP_DATA — アプリ追加・差し替えはここだけ編集
   
   【実際のアイコン画像を使う方法】
   1. アプリアイコン画像（60×60px以上の正方形）をGoogleドライブにアップロード
   2. 「共有」→「リンクをコピー」→ URL内の「id=」の後の文字列がファイルID
   3. icon_url に 'https://drive.google.com/uc?id=★ファイルID★' を指定
   4. 画像読み込み失敗時は自動的にemojiが表示されます
   
   【アプリを追加する場合】
   追加したいカテゴリの apps: [ ] 内の末尾に
   { id: 'unique_id', name: 'アプリ名', emoji: '🎯', icon_url: '', color: '#FF5733' }
   を追加してください（前の行の末尾に「,」を忘れずに）
============================================================ */
const D = [
  { id:'sns', name:'SNS・メッセージ', icon:'💬', bg:'#EBF5FF', bd:'#2B7EC9', apps:[
    { id:'line',      name:'LINE',         emoji:'💬', icon_url:'', color:'#06C755' },
    { id:'instagram', name:'Instagram',    emoji:'📷', icon_url:'', color:'#E1306C' },
    { id:'x',         name:'X',            emoji:'🐦', icon_url:'', color:'#000000' },
    { id:'facebook',  name:'Facebook',     emoji:'📘', icon_url:'', color:'#1877F2' },
    { id:'tiktok',    name:'TikTok',       emoji:'🎵', icon_url:'', color:'#000000' },
    { id:'youtube',   name:'YouTube',      emoji:'▶️', icon_url:'', color:'#FF0000' },
    { id:'threads',   name:'Threads',      emoji:'🧵', icon_url:'', color:'#000000' },
    { id:'zoom',      name:'Zoom',         emoji:'📹', icon_url:'', color:'#2D8CFF' },
  ]},
  { id:'fin', name:'決済・金融・ポイント', icon:'💳', bg:'#EDFBF0', bd:'#2E9E55', apps:[
    { id:'paypay',    name:'PayPay',       emoji:'🅿️', icon_url:'', color:'#FF0033' },
    { id:'rakupay',   name:'楽天ペイ',    emoji:'Ⓡ',  icon_url:'', color:'#BF0000' },
    { id:'dpay',      name:'d払い',       emoji:'ｄ',  icon_url:'', color:'#EB0000' },
    { id:'aupay',     name:'au PAY',      emoji:'ａ',  icon_url:'', color:'#E60012' },
    { id:'suica',     name:'Suica',       emoji:'🐧', icon_url:'', color:'#00A968' },
    { id:'merpay',    name:'メルペイ',    emoji:'🔴', icon_url:'', color:'#FF4444' },
    { id:'bank',      name:'銀行アプリ',  emoji:'🏦', icon_url:'', color:'#1A5276' },
    { id:'mfw',       name:'マネーフォワード', emoji:'📊', icon_url:'', color:'#003087' },
  ]},
  { id:'shop', name:'お買い物・フリマ', icon:'🛍️', bg:'#FEF0F0', bd:'#C0392B', apps:[
    { id:'amazon',  name:'Amazon',    emoji:'📦', icon_url:'', color:'#FF9900' },
    { id:'rakuten', name:'楽天市場',  emoji:'🛒', icon_url:'', color:'#BF0000' },
    { id:'mercari', name:'メルカリ',  emoji:'🎪', icon_url:'', color:'#FF0211' },
    { id:'yahoo',   name:'Yahoo!ショッピング', emoji:'🟣', icon_url:'', color:'#FF0033' },
    { id:'zozo',    name:'ZOZOTOWN', emoji:'👟', icon_url:'', color:'#000000' },
    { id:'uniqlo',  name:'UNIQLO',   emoji:'👕', icon_url:'', color:'#FF0000' },
    { id:'mats',    name:'マツキヨ', emoji:'💊', icon_url:'', color:'#009900' },
    { id:'qoo10',   name:'Qoo10',    emoji:'💄', icon_url:'', color:'#E91E8C' },
  ]},
  { id:'ent', name:'音楽・動画・エンタメ', icon:'🎵', bg:'#F5EEFF', bd:'#7B2FBE', apps:[
    { id:'spotify',  name:'Spotify',   emoji:'🎧', icon_url:'', color:'#1DB954' },
    { id:'amusic',   name:'Apple Music', emoji:'🎵', icon_url:'', color:'#FC3C44' },
    { id:'netflix',  name:'Netflix',   emoji:'🎬', icon_url:'', color:'#E50914' },
    { id:'disney',   name:'Disney+',   emoji:'✨', icon_url:'', color:'#0063E5' },
    { id:'prime',    name:'Prime Video', emoji:'📺', icon_url:'', color:'#00A8E0' },
    { id:'abema',    name:'ABEMA',     emoji:'📡', icon_url:'', color:'#009FFF' },
    { id:'manga',    name:'電子書籍',  emoji:'📚', icon_url:'', color:'#5C6BC0' },
    { id:'game',     name:'ゲーム全般', emoji:'🎮', icon_url:'', color:'#7B2FBE' },
  ]},
  { id:'work', name:'仕事・学習', icon:'💼', bg:'#FFF5E6', bd:'#D68910', apps:[
    { id:'gmail',   name:'Gmail',    emoji:'📧', icon_url:'', color:'#EA4335' },
    { id:'gdrive',  name:'Gドライブ', emoji:'💾', icon_url:'', color:'#4285F4' },
    { id:'office',  name:'Office系', emoji:'📝', icon_url:'', color:'#D83B01' },
    { id:'slack',   name:'Slack',    emoji:'💬', icon_url:'', color:'#4A154B' },
    { id:'chatwork',name:'Chatwork', emoji:'💬', icon_url:'', color:'#00A9D1' },
    { id:'notion',  name:'Notion',   emoji:'📓', icon_url:'', color:'#000000' },
    { id:'freee',   name:'freee',    emoji:'📋', icon_url:'', color:'#00A040' },
    { id:'duo',     name:'Duolingo', emoji:'🦜', icon_url:'', color:'#58CC02' },
  ]},
  { id:'life', name:'生活・健康・移動', icon:'🏠', bg:'#E8F7F7', bd:'#249496', apps:[
    { id:'gmap',    name:'Googleマップ', emoji:'📍', icon_url:'', color:'#4285F4' },
    { id:'transit', name:'乗換案内',  emoji:'🚃', icon_url:'', color:'#FF6600' },
    { id:'tabelog', name:'食べログ',  emoji:'🍽️', icon_url:'', color:'#E13B14' },
    { id:'hotto',   name:'ホットペッパー', emoji:'✂️', icon_url:'', color:'#FF0033' },
    { id:'cookpad', name:'クックパッド', emoji:'🍳', icon_url:'', color:'#F26522' },
    { id:'fit',     name:'歩数・健康', emoji:'🏃', icon_url:'', color:'#FF6B6B' },
    { id:'mynumber',name:'マイナポータル', emoji:'🪪', icon_url:'', color:'#009E96' },
    { id:'uber',    name:'出前・デリバリー', emoji:'🛵', icon_url:'', color:'#000000' },
  ]},
  { id:'news', name:'ニュース・天気・カレンダー', icon:'📰', bg:'#EEF2FF', bd:'#3B5BDB', apps:[
    { id:'ynews',   name:'Yahoo!ニュース', emoji:'📱', icon_url:'', color:'#FF0033' },
    { id:'nhk',     name:'NHKニュース',  emoji:'📺', icon_url:'', color:'#003087' },
    { id:'smtnews', name:'SmartNews',   emoji:'📰', icon_url:'', color:'#008CCF' },
    { id:'tenki',   name:'天気予報',    emoji:'☀️', icon_url:'', color:'#FF9800' },
    { id:'wnews',   name:'ウェザーニュース', emoji:'🌤️', icon_url:'', color:'#0078D4' },
    { id:'cal',     name:'カレンダー',  emoji:'📅', icon_url:'', color:'#EA4335' },
    { id:'radio',   name:'NHKラジオ',   emoji:'📻', icon_url:'', color:'#003087' },
    { id:'note',    name:'note / ブログ', emoji:'✍️', icon_url:'', color:'#41C9B4' },
  ]},
  { id:'photo', name:'写真・カメラ・その他', icon:'📸', bg:'#FFF0F5', bd:'#C0395E', apps:[
    { id:'camera', name:'カメラ',      emoji:'📸', icon_url:'', color:'#555555' },
    { id:'gphotos',name:'Gフォト',     emoji:'🖼️', icon_url:'', color:'#4285F4' },
    { id:'icloud', name:'iCloud写真',  emoji:'☁️', icon_url:'', color:'#0066CC' },
    { id:'pokemon',name:'ポケモンGO',  emoji:'⚡', icon_url:'', color:'#FFCC00' },
    { id:'print',  name:'フォト印刷',  emoji:'🖨️', icon_url:'', color:'#888888' },
    { id:'smart',  name:'スマートホーム', emoji:'🏠', icon_url:'', color:'#00C853' },
    { id:'travel', name:'旅行・宿予約', emoji:'✈️', icon_url:'', color:'#003580' },
    { id:'other',  name:'その他',      emoji:'⭐', icon_url:'', color:'#FFC107' },
  ]},
];

/* ── 状態 ── */
const S = {};
let cu = 0, ct = 0;

/* ── UI構築 ── */
function build() {
  const c = document.getElementById('con');
  D.forEach(cat => {
    const blk = document.createElement('div'); blk.className = 'cat';
    blk.innerHTML = `<div class="cat-hdr" style="background:${cat.bg};color:${cat.bd}">
      <span>${cat.icon}</span><span>${cat.name}</span>
      <span class="cat-cnt" id="cc-${cat.id}" style="background:${cat.bd}">0</span></div>`;
    const g = document.createElement('div'); g.className = 'grid';
    cat.apps.forEach(a => {
      S[a.id] = 0;
      const d = document.createElement('div'); d.className = 'app'; d.id = 'a-'+a.id;
      // アイコン
      const bg = rgba(a.color, .12);
      let icoHTML;
      if (a.icon_url) {
        icoHTML = `<img src="${a.icon_url}" alt="${a.name}"
          onerror="this.style.display='none';this.nextSibling.style.display='flex'">
          <span class="emo" style="display:none">${a.emoji}</span>`;
      } else {
        icoHTML = `<span class="emo" style="background:${bg};width:44px;height:44px;
          display:flex;align-items:center;justify-content:center;border-radius:10px;
          font-size:1.42rem">${a.emoji}</span>`;
      }
      d.innerHTML = `<div class="bdg" id="b-${a.id}">✓</div>
        <div class="ico">${icoHTML}</div>
        <div class="aname">${a.name}</div>`;
      d.onclick = () => tap(a.id, cat.id);
      g.appendChild(d);
    });
    blk.appendChild(g); c.appendChild(blk);
  });
}

function rgba(hex, a) {
  try {
    const h = hex.replace('#','');
    if (h.length!==6) return `rgba(128,128,128,${a})`;
    return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
  } catch { return `rgba(128,128,128,${a})`; }
}

/* ── タップ ── */
function tap(id, cid) {
  const p = S[id], n = (p+1)%3; S[id]=n;
  const d = document.getElementById('a-'+id);
  const b = document.getElementById('b-'+id);
  if(p===1) cu--; if(p===2) ct--;
  if(n===1){cu++;b.textContent='✓';} if(n===2){ct++;b.textContent='!';}
  d.classList.remove('used','trans','bnc'); void d.offsetWidth; d.classList.add('bnc');
  if(n===1) d.classList.add('used'); if(n===2) d.classList.add('trans');
  document.getElementById('cu').textContent = cu;
  document.getElementById('ct').textContent = ct;
  const cat = D.find(c=>c.id===cid);
  const cnt = cat ? cat.apps.filter(a=>S[a.id]>0).length : 0;
  const el  = document.getElementById('cc-'+cid); if(el) el.textContent = cnt;
}

/* ── 送信 ── */
async function send() {
  const u=[], t=[];
  D.forEach(cat=>cat.apps.forEach(a=>{ if(S[a.id]===1)u.push(a.name); if(S[a.id]===2)t.push(a.name); }));
  if(!u.length&&!t.length){alert('アプリを1つ以上選択してください。');return;}
  const btn=document.getElementById('sbtn'); btn.disabled=true; btn.textContent='送信中...';
  try {
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      token:'smaho2026sakurai',formType:'app_check',
      appUsed:u.join('、'),appTransfer:t.join('、')
    })});
  } catch(e){console.warn(e);}
  document.getElementById('osum').innerHTML =
    `<b>利用中 (${u.length}件)</b><br>${u.join(' / ')||'なし'}<br><br>`+
    `<b>移行必須 (${t.length}件)</b><br>${t.join(' / ')||'なし'}`;
  document.getElementById('ov').classList.add('show');
}
function closeOv(){
  document.getElementById('ov').classList.remove('show');
  const b=document.getElementById('sbtn'); b.disabled=false; b.textContent='カルテに記録して送信する →';
}

build();
</script>

</body>
</html>
