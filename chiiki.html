<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地域発見 | 吉田町まちなかLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary:   #249496;
  --primary-d: #1b7a7c;
  --navy:      #0f1f2e;
  --beige:     #FCFAF5;
  --beige-d:   #f0ece0;
  --white:     #ffffff;
  --text:      #1a1a1a;
  --muted:     #8a8a8a;
  --border:    rgba(0,0,0,0.08);
  --shadow:    0 2px 20px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.18);
  --r:         16px;
  --cat-discovery: #27AE60;
  --cat-gourmet:   #e8850a;
  --cat-trouble:   #E74C3C;
  --cat-event:     #9B59B6;
}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Noto Sans JP’, sans-serif;
background: var(–beige);
color: var(–text);
height: 100dvh;
display: flex;
flex-direction: column;
overflow: hidden;
}

/* ── ヘッダー ── */
.app-header {
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 0 16px;
height: 56px;
display: flex;
align-items: center;
justify-content: space-between;
flex-shrink: 0;
position: relative;
z-index: 100;
}
.app-logo {
font-family: ‘DM Sans’, sans-serif;
font-weight: 700;
font-size: 1.05rem;
color: var(–primary);
letter-spacing: -0.03em;
}
.app-logo span { color: var(–navy); }
.header-subtitle {
font-size: 0.58rem;
color: var(–muted);
position: absolute;
left: 50%;
transform: translateX(-50%);
white-space: nowrap;
}

/* ── タブナビ ── */
.view-tabs {
display: flex;
background: var(–white);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}
.view-tab {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
gap: 5px;
padding: 10px 0;
font-size: 0.78rem;
font-weight: 700;
color: var(–muted);
cursor: pointer;
border-bottom: 2.5px solid transparent;
transition: 0.2s;
user-select: none;
}
.view-tab.active {
color: var(–primary);
border-bottom-color: var(–primary);
}
.view-tab svg { width: 16px; height: 16px; }

/* ── カテゴリフィルター ── */
.cat-filter {
display: flex;
gap: 7px;
padding: 10px 14px;
overflow-x: auto;
background: var(–white);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
scrollbar-width: none;
}
.cat-filter::-webkit-scrollbar { display: none; }
.cat-pill {
flex-shrink: 0;
display: flex;
align-items: center;
gap: 4px;
padding: 5px 12px;
border-radius: 20px;
font-size: 0.72rem;
font-weight: 700;
cursor: pointer;
border: 1.5px solid var(–border);
background: var(–beige);
color: var(–muted);
transition: 0.18s;
white-space: nowrap;
}
.cat-pill.active { color: white; border-color: transparent; }
.cat-pill[data-cat=“all”].active         { background: var(–navy); }
.cat-pill[data-cat=“発見・景色”].active  { background: var(–cat-discovery); }
.cat-pill[data-cat=“グルメ”].active      { background: var(–cat-gourmet); }
.cat-pill[data-cat=“困りごと”].active    { background: var(–cat-trouble); }
.cat-pill[data-cat=“イベント”].active    { background: var(–cat-event); }

/* ── メインコンテンツ ── */
.main-content {
flex: 1;
overflow: hidden;
position: relative;
}

/* ── フィードビュー ── */
#feed-view {
height: 100%;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.feed-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 2px;
padding: 2px;
}

/* グリッドセル */
.feed-cell {
aspect-ratio: 1;
position: relative;
overflow: hidden;
cursor: pointer;
background: var(–beige-d);
}
.feed-cell img {
width: 100%; height: 100%;
object-fit: cover;
transition: transform 0.3s;
}
.feed-cell:active img { transform: scale(0.96); }
.feed-cell .cat-bg {
width: 100%; height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 6px;
color: white;
padding: 8px;
text-align: center;
}
.feed-cell .cat-icon { font-size: 1.6rem; }
.feed-cell .cat-text { font-size: 0.65rem; font-weight: 700; line-height: 1.3; }
.feed-cell .like-badge {
position: absolute;
bottom: 5px; right: 5px;
background: rgba(0,0,0,0.5);
color: white;
font-size: 0.6rem;
font-weight: 700;
padding: 2px 6px;
border-radius: 10px;
display: flex;
align-items: center;
gap: 2px;
backdrop-filter: blur(4px);
}

/* ローディング・エンプティ */
.feed-loading {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 60px 20px;
gap: 12px;
color: var(–muted);
font-size: 0.82rem;
}
.spinner {
width: 32px; height: 32px;
border: 3px solid var(–beige-d);
border-top-color: var(–primary);
border-radius: 50%;
animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.feed-empty {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 60px 20px;
gap: 10px;
color: var(–muted);
text-align: center;
}
.feed-empty-icon { font-size: 2.5rem; }
.feed-empty h3 { font-size: 0.9rem; color: var(–text); }
.feed-empty p  { font-size: 0.75rem; }

/* ── 詳細ポップアップ ── */
.detail-overlay {
position: fixed; inset: 0; z-index: 500;
background: rgba(0,0,0,0.75);
display: flex; align-items: flex-end;
opacity: 0; pointer-events: none;
transition: opacity 0.3s;
}
.detail-overlay.open { opacity: 1; pointer-events: all; }
.detail-sheet {
background: var(–white);
border-radius: 20px 20px 0 0;
width: 100%;
max-height: 82vh;
overflow-y: auto;
transform: translateY(100%);
transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
padding-bottom: env(safe-area-inset-bottom, 16px);
}
.detail-overlay.open .detail-sheet { transform: translateY(0); }

/* ── 詳細ヘッダー（戻るボタン付き）── */
.detail-header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 16px 0;
}
.detail-back-btn {
display: flex;
align-items: center;
gap: 6px;
background: #ffffff;
border: 2px solid var(–primary);
border-radius: 20px;
padding: 8px 16px 8px 12px;
font-family: inherit;
font-size: 0.82rem;
font-weight: 700;
color: var(–primary);
cursor: pointer;
transition: 0.18s;
box-shadow: 0 2px 12px rgba(0,0,0,0.18);
}
.detail-back-btn:active { transform: scale(0.95); background: #e8f7f7; }
.detail-back-btn svg { width: 16px; height: 16px; stroke: var(–primary); }
.detail-handle {
width: 40px; height: 5px;
background: #e0ddd6;
border-radius: 3px;
margin: 0 auto;
}

.detail-img {
width: 100%;
max-height: 52vw;
object-fit: cover;
margin-top: 8px;
}
.detail-img-placeholder {
width: 100%;
height: 52vw;
margin-top: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 3rem;
}
.detail-body { padding: 16px 18px 20px; }
.detail-cat-badge {
display: inline-flex;
align-items: center;
gap: 4px;
font-size: 0.7rem;
font-weight: 700;
color: white;
padding: 3px 10px;
border-radius: 20px;
margin-bottom: 10px;
}
.detail-title {
font-size: 1.05rem;
font-weight: 700;
margin-bottom: 4px;
line-height: 1.4;
}
.detail-address {
font-size: 0.75rem;
color: var(–muted);
display: flex;
align-items: center;
gap: 4px;
margin-bottom: 12px;
}
.detail-date {
font-size: 0.68rem;
color: var(–muted);
margin-bottom: 16px;
}
.detail-actions {
display: flex;
gap: 10px;
}
.like-btn {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 12px;
border-radius: 12px;
border: 2px solid #e8e4d8;
font-family: inherit;
font-size: 0.85rem;
font-weight: 700;
cursor: pointer;
transition: 0.2s;
background: var(–beige-d);
color: var(–text);
}
.like-btn.liked { background: #fde8e8; color: #e74c3c; border-color: #f5c0c0; }
.like-btn:active { transform: scale(0.95); }

/* 「地図で見る」ボタン：button要素に変更（内部マップに遷移） */
.map-link-btn {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 12px;
border-radius: 12px;
background: #ffffff;
color: var(–primary);
font-family: inherit;
font-size: 0.85rem;
font-weight: 700;
border: 2px solid var(–primary);
cursor: pointer;
transition: 0.2s;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.map-link-btn:active { background: #e8f7f7; transform: scale(0.95); }

/* ── マップビュー ── */
#map-view {
height: 100%;
display: none;
}
#map-view.active { display: block; }
#chiiki-map { width: 100%; height: 100%; }

/* ── 投稿促進バナー（フィード下部） ── */
.post-cta {
margin: 16px 14px;
background: linear-gradient(135deg, var(–primary) 0%, var(–primary-d) 100%);
border-radius: var(–r);
padding: 18px 16px;
color: white;
text-align: center;
}
.post-cta h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
.post-cta p  { font-size: 0.72rem; opacity: 0.85; margin-bottom: 12px; }

/* LINEで投稿するボタン：buttonに変更 */
.post-cta-btn {
display: inline-block;
background: white;
color: var(–primary);
font-weight: 700;
font-size: 0.8rem;
padding: 9px 22px;
border-radius: 20px;
text-decoration: none;
font-family: inherit;
border: none;
cursor: pointer;
}

/* ── スライドイン アニメーション ── */
.feed-cell {
animation: cellIn 0.4s ease both;
}
@keyframes cellIn {
from { opacity: 0; transform: scale(0.92); }
to   { opacity: 1; transform: scale(1); }
}

/* ── 投稿モーダル ── */
.post-modal-overlay {
position: fixed; inset: 0; z-index: 600;
background: rgba(0,0,0,0.72);
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
display: flex; align-items: flex-end;
opacity: 0; pointer-events: none;
transition: opacity 0.3s;
}
.post-modal-overlay.open { opacity: 1; pointer-events: all; }
.post-modal-sheet {
background: #ffffff;
border-radius: 24px 24px 0 0;
width: 100%;
padding: 8px 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
transform: translateY(100%);
transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
}
.post-modal-overlay.open .post-modal-sheet { transform: translateY(0); }
.post-modal-handle {
width: 40px; height: 5px;
background: #e0ddd6;
border-radius: 3px;
margin: 10px auto 18px;
}
.post-modal-title {
font-size: 1.05rem;
font-weight: 900;
text-align: center;
margin-bottom: 5px;
color: #1a1a1a;
}
.post-modal-sub {
font-size: 0.73rem;
color: #888;
text-align: center;
margin-bottom: 18px;
line-height: 1.6;
}
.post-modal-actions {
display: flex;
flex-direction: column;
gap: 10px;
}
.post-action-btn {
display: flex;
align-items: center;
gap: 14px;
padding: 14px 16px;
border-radius: 16px;
border: 1.5px solid #e0dbd0;
background: #f7f5f0;
font-family: inherit;
font-size: 0.88rem;
font-weight: 700;
color: #1a1a1a;
cursor: pointer;
transition: 0.18s;
text-decoration: none;
box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}
.post-action-btn:active { transform: scale(0.97); background: #edeae2; }
.post-action-icon {
width: 44px; height: 44px;
border-radius: 14px;
display: flex; align-items: center; justify-content: center;
font-size: 1.5rem;
flex-shrink: 0;
}
.post-action-text { display: flex; flex-direction: column; gap: 3px; }
.post-action-label { font-size: 0.88rem; font-weight: 700; color: #1a1a1a; }
.post-action-desc  { font-size: 0.68rem; color: #888; font-weight: 400; }
.post-modal-cancel {
margin-top: 10px;
width: 100%;
padding: 13px;
border-radius: 14px;
border: none;
background: #f0ece0;
font-family: inherit;
font-size: 0.85rem;
font-weight: 700;
color: #888;
cursor: pointer;
transition: 0.18s;
}
.post-modal-cancel:active { background: #e5e0d4; }

/* ── STEP2スタイル ── */
.post-step2-cat {
text-align: center;
font-size: 2rem;
margin-bottom: 6px;
padding: 10px;
background: var(–beige-d);
border-radius: 14px;
margin-bottom: 14px;
font-weight: 700;
color: var(–text);
}
.post-step2-guide {
display: flex;
flex-direction: column;
gap: 10px;
margin-bottom: 20px;
background: var(–beige);
border-radius: 14px;
padding: 14px 16px;
}
.post-step2-step {
display: flex;
align-items: center;
gap: 12px;
}
.post-step2-num {
width: 26px; height: 26px;
border-radius: 50%;
background: var(–primary);
color: white;
font-size: 0.78rem;
font-weight: 900;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0;
}
.post-step2-text {
font-size: 0.82rem;
font-weight: 700;
color: var(–text);
}
.post-line-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
width: 100%;
padding: 15px;
border-radius: 14px;
background: #06C755;
color: white;
font-family: inherit;
font-size: 0.95rem;
font-weight: 900;
text-decoration: none;
margin-bottom: 10px;
box-shadow: 0 3px 12px rgba(6,199,85,0.35);
transition: 0.18s;
}
.post-line-btn:active { background: #05b04c; transform: scale(0.98); }
</style>

</head>

    </div>
    <div class="post-step2-step">
      <div class="post-step2-num">2</div>
      <div class="post-step2-text">トーク画面で送信ボタンを押す</div>
    </div>
    <div class="post-step2-step">
      <div class="post-step2-num">3</div>
      <div class="post-step2-text">返信に従って位置情報・写真を送る</div>
    </div>
  </div>
  <a class="post-line-btn" id="post-line-link" href="#">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M12 2C6.48 2 2 5.92 2 10.72c0 3.2 1.88 6.01 4.72 7.7L6 22l4.44-2.32c.51.09 1.03.14 1.56.14 5.52 0 10-3.92 10-8.72C22 5.92 17.52 2 12 2z"/></svg>
    LINEで送信する
  </a>
  <button class="post-modal-cancel" onclick="backToStep1()">← カテゴリを選び直す</button>
</div>
```

  </div>
</div>

<script>
// ==========================================
// 設定
// ==========================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz3CsxRGLTs5HzPI9zw0q9sXPTTOIQhI2zV-48snqVNiw16TNi8zmTDYveK6jkZjeM/exec';
const MAPS_API_KEY = 'AIzaSyDeC5HxWHonkgh7p-fUe8k6OzKns8Rienk';

const CAT_CONFIG = {
  '発見・景色': { color: '#27AE60', icon: '🌸' },
  'グルメ':     { color: '#e8850a', icon: '🍜' },
  '困りごと':   { color: '#E74C3C', icon: '⚠️' },
  'イベント':   { color: '#9B59B6', icon: '🎉' }
};

// ==========================================
// 状態管理
// ==========================================
let allRecords      = [];
let filteredRecords = [];
let currentCat      = 'all';
let currentView     = 'feed';
let currentRecord   = null;
let likedIds        = JSON.parse(localStorage.getItem('chiiki_likes') || '{}');
let chiikiMap       = null;
let mapMarkers      = [];
let mapInitialized  = false;
let focusedLat      = null; // 詳細→マップ遷移時のフォーカス位置
let focusedLng      = null;

// ==========================================
// データ取得
// ==========================================
async function loadData() {
  try {
    const res  = await fetch(GAS_URL + '?action=getChiikiData');
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message);
    allRecords = (json.records || []).reverse();
    document.getElementById('total-count').textContent = allRecords.length;
    filterCat(currentCat);
  } catch(e) {
    console.error('データ取得エラー:', e);
    document.getElementById('feed-grid-wrap').innerHTML = `
      <div class="feed-empty">
        <div class="feed-empty-icon">📡</div>
        <h3>データを取得できませんでした</h3>
        <p>しばらく経ってから再度お試しください</p>
      </div>`;
  }
}

// ==========================================
// カテゴリフィルター
// ==========================================
function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  document.querySelector(`.cat-pill[data-cat="${cat}"]`).classList.add('active');
  filteredRecords = cat === 'all' ? allRecords : allRecords.filter(r => r.category === cat);
  renderFeed();
  if (currentView === 'map' && mapInitialized) renderMapMarkers();
}

// ==========================================
// フィードレンダリング
// ==========================================
function renderFeed() {
  const wrap = document.getElementById('feed-grid-wrap');

  if (filteredRecords.length === 0) {
    wrap.innerHTML = `
      <div class="feed-empty">
        <div class="feed-empty-icon">🔍</div>
        <h3>まだ投稿がありません</h3>
        <p>LINEから地域発見を投稿してみましょう！</p>
      </div>
      <div class="post-cta">
        <h3>📸 あなたも投稿しよう！</h3>
        <p>吉田町の素敵な場所・美味しいお店・地域の情報をシェアしてください</p>
        <button class="post-cta-btn" onclick="openPostModal()">LINEで投稿する →</button>
      </div>`;
    return;
  }

  const cells = filteredRecords.map((rec, i) => {
    const cat   = CAT_CONFIG[rec.category] || { color: '#249496', icon: '📍' };
    const likes = rec.likes || 0;
    const delay = Math.min(i * 0.04, 0.5);

    let inner = '';
    if (rec.imageUrl) {
      inner = `<img src="${rec.imageUrl}" alt="${rec.title}" loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
               <div class="cat-bg" style="background:${cat.color};display:none;">
                 <div class="cat-icon">${cat.icon}</div>
                 <div class="cat-text">${rec.title || rec.category}</div>
               </div>`;
    } else {
      inner = `<div class="cat-bg" style="background:${cat.color};">
                 <div class="cat-icon">${cat.icon}</div>
                 <div class="cat-text">${rec.title || rec.category}</div>
               </div>`;
    }

    return `<div class="feed-cell" style="animation-delay:${delay}s" onclick="openDetail(${i})">
              ${inner}
              ${likes > 0 ? `<div class="like-badge">❤️ ${likes}</div>` : ''}
            </div>`;
  }).join('');

  wrap.innerHTML = `<div class="feed-grid">${cells}</div>
    <div class="post-cta">
      <h3>📸 あなたも投稿しよう！</h3>
      <p>吉田町の素敵な場所・美味しいお店・地域の情報をシェアしてください</p>
      <button class="post-cta-btn" onclick="openPostModal()">LINEで投稿する →</button>
    </div>`;
}

// ==========================================
// 詳細ポップアップ
// ==========================================
function openDetail(index) {
  const rec = filteredRecords[index];
  if (!rec) return;
  currentRecord = { ...rec, index };

  const cat   = CAT_CONFIG[rec.category] || { color: '#249496', icon: '📍' };
  const liked = !!likedIds[rec.date + rec.lat];

  const imgWrap = document.getElementById('detail-img-wrap');
  if (rec.imageUrl) {
    imgWrap.innerHTML = `<img class="detail-img" src="${rec.imageUrl}" alt="${rec.title}"
      onerror="this.style.display='none'">`;
  } else {
    imgWrap.innerHTML = `<div class="detail-img-placeholder" style="background:${cat.color}20;">
      <span style="font-size:4rem">${cat.icon}</span></div>`;
  }

  document.getElementById('detail-cat-badge').textContent = cat.icon + ' ' + rec.category;
  document.getElementById('detail-cat-badge').style.background = cat.color;
  document.getElementById('detail-title').textContent  = rec.title || rec.category;
  document.getElementById('detail-address').innerHTML  = `<span>📍</span>${rec.address || '住所不明'}`;
  document.getElementById('detail-date').textContent   = '📅 ' + (rec.date ? rec.date.substring(0,10) : '---');
  document.getElementById('like-count').textContent    = rec.likes || 0;
  document.getElementById('like-btn').className       = 'like-btn' + (liked ? ' liked' : '');

  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}

function closeDetailOnBg(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
}

// ==========================================
// 「地図で見る」→ 内部マップタブへ遷移
// ==========================================
function openInternalMap() {
  if (!currentRecord) return;
  focusedLat = currentRecord.lat;
  focusedLng = currentRecord.lng;
  closeDetail();
  switchView('map');
}

// ==========================================
// いいね機能
// ==========================================
async function toggleLike() {
  if (!currentRecord) return;
  const key   = currentRecord.date + currentRecord.lat;
  const liked = !!likedIds[key];
  const btn   = document.getElementById('like-btn');
  const cnt   = document.getElementById('like-count');

  if (liked) {
    delete likedIds[key];
    currentRecord.likes = Math.max(0, (currentRecord.likes || 1) - 1);
    btn.className = 'like-btn';
  } else {
    likedIds[key] = true;
    currentRecord.likes = (currentRecord.likes || 0) + 1;
    btn.className = 'like-btn liked';
    btn.style.transform = 'scale(1.15)';
    setTimeout(() => btn.style.transform = '', 200);
  }

  cnt.textContent = currentRecord.likes;
  localStorage.setItem('chiiki_likes', JSON.stringify(likedIds));

  try {
    await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        formType:   'chiiki_like',
        recordDate: currentRecord.date,
        lat:        currentRecord.lat,
        liked:      !liked
      })
    });
  } catch(e) { console.warn('いいね送信エラー:', e); }

  renderFeed();
}

// ==========================================
// ビュー切り替え（フィード⇔マップ）
// ==========================================
function switchView(view) {
  currentView = view;
  document.getElementById('tab-feed').classList.toggle('active', view === 'feed');
  document.getElementById('tab-map').classList.toggle('active', view === 'map');
  document.getElementById('feed-view').style.display = view === 'feed' ? 'block' : 'none';
  document.getElementById('map-view').style.display  = view === 'map'  ? 'block' : 'none';

  if (view === 'map' && !mapInitialized) {
    initChiikiMap();
  } else if (view === 'map') {
    renderMapMarkers();
    // 詳細→マップ遷移時はそのピンにフォーカス
    if (focusedLat && focusedLng && chiikiMap) {
      chiikiMap.setCenter({ lat: focusedLat, lng: focusedLng });
      chiikiMap.setZoom(16);
      focusedLat = null;
      focusedLng = null;
    }
  }
}

// ==========================================
// マップ初期化
// ==========================================
function initChiikiMap() {
  chiikiMap = new google.maps.Map(document.getElementById('chiiki-map'), {
    center:            { lat: 34.768, lng: 138.261 },
    zoom:              13,
    mapTypeId:         'roadmap',
    zoomControl:       true,
    mapTypeControl:    false,
    streetViewControl: false,
    fullscreenControl: false,
    gestureHandling:   'greedy',
    styles: [
      { featureType: 'poi',     stylers: [{ visibility: 'simplified' }] },
      { featureType: 'transit', stylers: [{ visibility: 'off' }] },
      { featureType: 'water',   stylers: [{ color: '#b3d4f5' }] }
    ]
  });
  mapInitialized = true;
  renderMapMarkers();

  // 詳細→マップ遷移時はそのピンにフォーカス
  if (focusedLat && focusedLng) {
    chiikiMap.setCenter({ lat: focusedLat, lng: focusedLng });
    chiikiMap.setZoom(16);
    focusedLat = null;
    focusedLng = null;
  }
}

function renderMapMarkers() {
  mapMarkers.forEach(m => m.setMap(null));
  mapMarkers = [];

  filteredRecords.forEach(function(rec, i) {
    if (!rec.lat || !rec.lng) return;
    const cat = CAT_CONFIG[rec.category] || { color: '#249496', icon: '📍' };
    const marker = new google.maps.Marker({
      position:  { lat: rec.lat, lng: rec.lng },
      map:       chiikiMap,
      title:     rec.title,
      icon: {
        path:        google.maps.SymbolPath.CIRCLE,
        fillColor:    cat.color,
        fillOpacity:  1,
        strokeColor:  '#ffffff',
        strokeWeight: 2.5,
        scale:        13
      },
      animation: google.maps.Animation.DROP
    });
    marker.addListener('click', function() { openDetail(i); });
    mapMarkers.push(marker);
  });
}

// ==========================================
// Google Maps 読み込み
// ==========================================
function onMapsReady() {}

// ==========================================
// 投稿モーダル（2ステップ）
// ==========================================
function openPostModal() {
  backToStep1(); // 常にSTEP1から開始
  document.getElementById('post-modal').classList.add('open');
}
function closePostModal() {
  document.getElementById('post-modal').classList.remove('open');
}
function closePostModalOnBg(e) {
  if (e.target === document.getElementById('post-modal')) closePostModal();
}

function selectPostCategory(cat) {
  const catConfig = {
    '発見・景色': { icon: '🌸', color: '#27AE60' },
    'グルメ':     { icon: '🍜', color: '#e8850a' },
    '困りごと':   { icon: '⚠️', color: '#E74C3C' },
    'イベント':   { icon: '🎉', color: '#9B59B6' }
  };
  const cfg = catConfig[cat];

  // STEP2のカテゴリ表示を更新
  const catEl = document.getElementById('post-step2-cat');
  catEl.innerHTML = `${cfg.icon} <span style="color:${cfg.color}">${cat}</span> を選択しました`;

  // LINEリンクのURLを生成（「地域発見：〇〇」をURLエンコード）
  const msg = encodeURIComponent('地域発見：' + cat);
  document.getElementById('post-line-link').href =
    'https://line.me/R/oaMessage/@281jfkpu/?' + msg;

  // STEP1→STEP2へ切り替え
  document.getElementById('post-step1').style.display = 'none';
  document.getElementById('post-step2').style.display = 'block';
}

function backToStep1() {
  document.getElementById('post-step1').style.display = 'block';
  document.getElementById('post-step2').style.display = 'none';
}

// ==========================================
// 起動
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
  switchView('feed');
  loadData();
});
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDeC5HxWHonkgh7p-fUe8k6OzKns8Rienk&callback=onMapsReady&language=ja"
  async defer>
</script>

</body>
</html>
