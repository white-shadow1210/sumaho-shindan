<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地域発見 | 吉田町まちなかLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary:   #249496;
  --primary-d: #1b7a7c;
  --navy:      #0f1f2e;
  --beige:     #FCFAF5;
  --beige-d:   #f0ece0;
  --white:     #ffffff;
  --text:      #1a1a1a;
  --muted:     #8a8a8a;
  --border:    rgba(0,0,0,0.08);
  --shadow:    0 2px 20px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.18);
  --r:         16px;
  --cat-discovery: #27AE60;
  --cat-gourmet:   #e8850a;
  --cat-trouble:   #E74C3C;
  --cat-event:     #9B59B6;
}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Noto Sans JP’, sans-serif;
background: var(–beige);
color: var(–text);
height: 100dvh;
display: flex;
flex-direction: column;
overflow: hidden;
}

/* ── ヘッダー ── */
.app-header {
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 0 16px;
height: 56px;
display: flex;
align-items: center;
justify-content: space-between;
flex-shrink: 0;
position: relative;
z-index: 100;
}
.app-logo {
font-family: ‘DM Sans’, sans-serif;
font-weight: 700;
font-size: 1.05rem;
color: var(–primary);
letter-spacing: -0.03em;
}
.app-logo span { color: var(–navy); }
.header-subtitle {
font-size: 0.58rem;
color: var(–muted);
position: absolute;
left: 50%;
transform: translateX(-50%);
white-space: nowrap;
}

/* ── タブナビ ── */
.view-tabs {
display: flex;
background: var(–white);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}
.view-tab {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
gap: 5px;
padding: 10px 0;
font-size: 0.78rem;
font-weight: 700;
color: var(–muted);
cursor: pointer;
border-bottom: 2.5px solid transparent;
transition: 0.2s;
user-select: none;
}
.view-tab.active {
color: var(–primary);
border-bottom-color: var(–primary);
}
.view-tab svg { width: 16px; height: 16px; }

/* ── カテゴリフィルター ── */
.cat-filter {
display: flex;
gap: 7px;
padding: 10px 14px;
overflow-x: auto;
background: var(–white);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
scrollbar-width: none;
}
.cat-filter::-webkit-scrollbar { display: none; }
.cat-pill {
flex-shrink: 0;
display: flex;
align-items: center;
gap: 4px;
padding: 5px 12px;
border-radius: 20px;
font-size: 0.72rem;
font-weight: 700;
cursor: pointer;
border: 1.5px solid var(–border);
background: var(–beige);
color: var(–muted);
transition: 0.18s;
white-space: nowrap;
}
.cat-pill.active { color: white; border-color: transparent; }
.cat-pill[data-cat=“all”].active         { background: var(–navy); }
.cat-pill[data-cat=“発見・景色”].active  { background: var(–cat-discovery); }
.cat-pill[data-cat=“グルメ”].active      { background: var(–cat-gourmet); }
.cat-pill[data-cat=“困りごと”].active    { background: var(–cat-trouble); }
.cat-pill[data-cat=“イベント”].active    { background: var(–cat-event); }

/* ── メインコンテンツ ── */
.main-content {
flex: 1;
overflow: hidden;
position: relative;
}

/* ── フィードビュー ── */
#feed-view {
height: 100%;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.feed-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 2px;
padding: 2px;
}

/* グリッドセル */
.feed-cell {
aspect-ratio: 1;
position: relative;
overflow: hidden;
cursor: pointer;
background: var(–beige-d);
}
.feed-cell img {
width: 100%; height: 100%;
object-fit: cover;
transition: transform 0.3s;
}
.feed-cell:active img { transform: scale(0.96); }
.feed-cell .cat-bg {
width: 100%; height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 6px;
color: white;
padding: 8px;
text-align: center;
}
.feed-cell .cat-icon { font-size: 1.6rem; }
.feed-cell .cat-text { font-size: 0.65rem; font-weight: 700; line-height: 1.3; }
.feed-cell .like-badge {
position: absolute;
bottom: 5px; right: 5px;
background: rgba(0,0,0,0.5);
color: white;
font-size: 0.6rem;
font-weight: 700;
padding: 2px 6px;
border-radius: 10px;
display: flex;
align-items: center;
gap: 2px;
backdrop-filter: blur(4px);
}

/* ローディング・エンプティ */
.feed-loading {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 60px 20px;
gap: 12px;
color: var(–muted);
font-size: 0.82rem;
}
.spinner {
width: 32px; height: 32px;
border: 3px solid var(–beige-d);
border-top-color: var(–primary);
border-radius: 50%;
animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.feed-empty {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 60px 20px;
gap: 10px;
color: var(–muted);
text-align: center;
}
.feed-empty-icon { font-size: 2.5rem; }
.feed-empty h3 { font-size: 0.9rem; color: var(–text); }
.feed-empty p  { font-size: 0.75rem; }

/* ── 詳細ポップアップ ── */
.detail-overlay {
position: fixed; inset: 0; z-index: 500;
background: rgba(0,0,0,0.75);
display: flex; align-items: flex-end;
opacity: 0; pointer-events: none;
transition: opacity 0.3s;
}
.detail-overlay.open { opacity: 1; pointer-events: all; }
.detail-sheet {
background: var(–white);
border-radius: 20px 20px 0 0;
width: 100%;
max-height: 82vh;
overflow-y: auto;
transform: translateY(100%);
transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
padding-bottom: env(safe-area-inset-bottom, 16px);
}
.detail-overlay.open .detail-sheet { transform: translateY(0); }

/* ── 詳細ヘッダー（戻るボタン付き）── */
.detail-header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 16px 0;
}
.detail-back-btn {
display: flex;
align-items: center;
gap: 6px;
background: #ffffff;
border: 2px solid var(–primary);
border-radius: 20px;
padding: 8px 16px 8px 12px;
font-family: inherit;
font-size: 0.82rem;
font-weight: 700;
color: var(–primary);
cursor: pointer;
transition: 0.18s;
box-shadow: 0 2px 12px rgba(0,0,0,0.18);
}
.detail-back-btn:active { transform: scale(0.95); background: #e8f7f7; }
.detail-back-btn svg { width: 16px; height: 16px; stroke: var(–primary); }
.detail-handle {
width: 40px; height: 5px;
background: #e0ddd6;
border-radius: 3px;
margin: 0 auto;
}

.detail-img {
width: 100%;
max-height: 52vw;
object-fit: cover;
margin-top: 8px;
}
.detail-img-placeholder {
width: 100%;
height: 52vw;
margin-top: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 3rem;
}
.detail-body { padding: 16px 18px 20px; }
.detail-cat-badge {
display: inline-flex;
align-items: center;
gap: 4px;
font-size: 0.7rem;
font-weight: 700;
color: white;
padding: 3px 10px;
border-radius: 20px;
margin-bottom: 10px;
}
.detail-title {
font-size: 1.05rem;
font-weight: 700;
margin-bottom: 4px;
line-height: 1.4;
}
.detail-address {
font-size: 0.75rem;
color: var(–muted);
display: flex;
align-items: center;
gap: 4px;
margin-bottom: 12px;
}
.detail-date {
font-size: 0.68rem;
color: var(–muted);
margin-bottom: 16px;
}
.detail-actions {
display: flex;
gap: 10px;
}
.like-btn {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 12px;
border-radius: 12px;
border: 2px solid #e8e4d8;
font-family: inherit;
font-size: 0.85rem;
font-weight: 700;
cursor: pointer;
transition: 0.2s;
background: var(–beige-d);
color: var(–text);
}
.like-btn.liked { background: #fde8e8; color: #e74c3c; border-color: #f5c0c0; }
.like-btn:active { transform: scale(0.95); }

/* 「地図で見る」ボタン：button要素に変更（内部マップに遷移） */
.map-link-btn {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 12px;
border-radius: 12px;
background: #ffffff;
color: var(–primary);
font-family: inherit;
font-size: 0.85rem;
font-weight: 700;
border: 2px solid var(–primary);
cursor: pointer;
transition: 0.2s;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.map-link-btn:active { background: #e8f7f7; transform: scale(0.95); }

/* ── マップビュー ── */
#map-view {
height: 100%;
display: none;
}
#map-view.active { display: block; }
#chiiki-map { width: 100%; height: 100%; }

/* ── 投稿促進バナー（フィード下部） ── */
.post-cta {
margin: 16px 14px;
background: linear-gradient(135deg, var(–primary) 0%, var(–primary-d) 100%);
border-radius: var(–r);
padding: 18px 16px;
color: white;
text-align: center;
}
.post-cta h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
.post-cta p  { font-size: 0.72rem; opacity: 0.85; margin-bottom: 12px; }

/* LINEで投稿するボタン：buttonに変更 */
.post-cta-btn {
display: inline-block;
background: white;
color: var(–primary);
font-weight: 700;
font-size: 0.8rem;
padding: 9px 22px;
border-radius: 20px;
text-decoration: none;
font-family: inherit;
border: none;
cursor: pointer;
}

/* ── スライドイン アニメーション ── */
.feed-cell {
animation: cellIn 0.4s ease both;
}
@keyframes cellIn {
from { opacity: 0; transform: scale(0.92); }
to   { opacity: 1; transform: scale(1); }
}

/* ── 投稿モーダル ── */
.post-modal-overlay {
position: fixed; inset: 0; z-index: 600;
background: rgba(0,0,0,0.72);
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
display: flex; align-items: flex-end;
opacity: 0; pointer-events: none;
transition: opacity 0.3s;
}
.post-modal-overlay.open { opacity: 1; pointer-events: all; }
.post-modal-sheet {
background: #ffffff;
border-radius: 24px 24px 0 0;
width: 100%;
max-height: 90vh;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
transform: translateY(100%);
transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
padding: 8px 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
}
.post-modal-overlay.open .post-modal-sheet { transform: translateY(0); }
.post-modal-handle {
width: 40px; height: 5px;
background: #e0ddd6;
border-radius: 3px;
margin: 10px auto 18px;
}
.post-modal-title {
font-size: 1.05rem;
font-weight: 900;
text-align: center;
margin-bottom: 5px;
color: #1a1a1a;
}
.post-modal-sub {
font-size: 0.73rem;
color: #888;
text-align: center;
margin-bottom: 18px;
line-height: 1.6;
}
.post-modal-actions {
display: flex;
flex-direction: column;
gap: 10px;
}
.post-action-btn {
display: flex;
align-items: center;
gap: 14px;
padding: 14px 16px;
border-radius: 16px;
border: 1.5px solid #e0dbd0;
background: #f7f5f0;
font-family: inherit;
font-size: 0.88rem;
font-weight: 700;
color: #1a1a1a;
cursor: pointer;
transition: 0.18s;
text-decoration: none;
box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}
.post-action-btn:active { transform: scale(0.97); background: #edeae2; }
.post-action-icon {
width: 44px; height: 44px;
border-radius: 14px;
display: flex; align-items: center; justify-content: center;
font-size: 1.5rem;
flex-shrink: 0;
}
.post-action-text { display: flex; flex-direction: column; gap: 3px; }
.post-action-label { font-size: 0.88rem; font-weight: 700; color: #1a1a1a; }
.post-action-desc  { font-size: 0.68rem; color: #888; font-weight: 400; }
.post-modal-cancel {
margin-top: 10px;
width: 100%;
padding: 13px;
border-radius: 14px;
border: none;
background: #f0ece0;
font-family: inherit;
font-size: 0.85rem;
font-weight: 700;
color: #888;
cursor: pointer;
transition: 0.18s;
}
.post-modal-cancel:active { background: #e5e0d4; }

/* ── 投稿フォームスタイル ── */
.submit-label {
font-size: 0.8rem;
font-weight: 700;
color: var(–text);
margin-bottom: 6px;
}
.submit-required {
color: #e74c3c;
font-size: 0.68rem;
margin-left: 4px;
}
.submit-cat-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 4px;
}
.submit-cat-btn {
padding: 10px 6px;
border-radius: 12px;
border: 2px solid var(–border);
background: var(–beige);
font-family: inherit;
font-size: 0.82rem;
font-weight: 700;
color: var(–text);
cursor: pointer;
transition: 0.18s;
}
.submit-cat-btn.selected {
border-color: var(–primary);
background: #e8f7f7;
color: var(–primary);
}
.submit-cat-btn:active { transform: scale(0.96); }
.submit-input {
width: 100%;
padding: 10px 14px;
border-radius: 12px;
border: 1.5px solid var(–border);
background: var(–beige);
font-family: inherit;
font-size: 0.88rem;
color: var(–text);
outline: none;
box-sizing: border-box;
max-width: 100%;
}
.submit-input:focus { border-color: var(–primary); }
.submit-img-label { display: block; cursor: pointer; }
.submit-img-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
padding: 11px;
border-radius: 12px;
border: 2px dashed var(–border);
background: var(–beige);
font-size: 0.85rem;
font-weight: 700;
color: var(–muted);
transition: 0.18s;
}
.submit-img-buttons {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
}
.submit-img-half-label { display: block; cursor: pointer; }
.submit-img-half-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 11px 6px;
border-radius: 12px;
border: 2px dashed var(–border);
background: var(–beige);
font-size: 0.82rem;
font-weight: 700;
color: var(–muted);
transition: 0.18s;
white-space: nowrap;
}
.submit-img-half-btn:active { background: var(–beige-d); }
.submit-location-note {
font-size: 0.72rem;
color: var(–muted);
text-align: center;
margin: 10px 0 4px;
padding: 8px;
background: var(–beige);
border-radius: 10px;
}
.submit-post-btn {
width: 100%;
padding: 15px;
border-radius: 14px;
border: none;
background: var(–primary);
color: white;
font-family: inherit;
font-size: 1rem;
font-weight: 900;
cursor: pointer;
transition: 0.18s;
margin-bottom: 10px;
box-shadow: 0 3px 12px rgba(36,148,150,0.35);
}
.submit-post-btn:disabled {
background: var(–muted);
box-shadow: none;
cursor: not-allowed;
}
.submit-post-btn:not(:disabled):active { background: var(–primary-d); transform: scale(0.98); }

/* ── STEP2スタイル ── */
.post-step2-cat {
text-align: center;
font-size: 2rem;
margin-bottom: 6px;
padding: 10px;
background: var(–beige-d);
border-radius: 14px;
margin-bottom: 14px;
font-weight: 700;
color: var(–text);
}
.post-step2-guide {
display: flex;
flex-direction: column;
gap: 10px;
margin-bottom: 20px;
background: var(–beige);
border-radius: 14px;
padding: 14px 16px;
}
.post-step2-step {
display: flex;
align-items: center;
gap: 12px;
}
.post-step2-num {
width: 26px; height: 26px;
border-radius: 50%;
background: var(–primary);
color: white;
font-size: 0.78rem;
font-weight: 900;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0;
}
.post-step2-text {
font-size: 0.82rem;
font-weight: 700;
color: var(–text);
}
.post-line-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
width: 100%;
padding: 15px;
border-radius: 14px;
background: #06C755;
color: white;
font-family: inherit;
font-size: 0.95rem;
font-weight: 900;
text-decoration: none;
margin-bottom: 10px;
box-shadow: 0 3px 12px rgba(6,199,85,0.35);
transition: 0.18s;
}
.post-line-btn:active { background: #05b04c; transform: scale(0.98); }
</style>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>
<body>

<!-- ヘッダー -->

<header class="app-header">
  <div class="app-logo">まちなか<span>発見</span></div>
  <div class="header-subtitle">吉田町・牧之原市エリア</div>
  <div style="font-size:0.65rem;color:var(--muted);text-align:right;">
    <span id="total-count">--</span>件
  </div>
</header>

<!-- タブ -->

<div class="view-tabs">
  <div class="view-tab active" id="tab-feed" onclick="switchView('feed')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    フィード
  </div>
  <div class="view-tab" id="tab-map" onclick="switchView('map')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
    マップ
  </div>
</div>

<!-- カテゴリフィルター -->

<div class="cat-filter" id="cat-filter">
  <div class="cat-pill active" data-cat="all"      onclick="filterCat('all')">🗺️ すべて</div>
  <div class="cat-pill"        data-cat="発見・景色" onclick="filterCat('発見・景色')">🌸 発見・景色</div>
  <div class="cat-pill"        data-cat="グルメ"     onclick="filterCat('グルメ')">🍜 グルメ</div>
  <div class="cat-pill"        data-cat="困りごと"   onclick="filterCat('困りごと')">⚠️ 困りごと</div>
  <div class="cat-pill"        data-cat="イベント"   onclick="filterCat('イベント')">🎉 イベント</div>
</div>

<!-- メインコンテンツ -->

<div class="main-content">
  <!-- フィードビュー -->
  <div id="feed-view">
    <div id="feed-grid-wrap">
      <div class="feed-loading">
        <div class="spinner"></div>
        <div>読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- マップビュー -->

  <div id="map-view">
    <div id="chiiki-map"></div>
  </div>
</div>

<!-- 詳細ポップアップ -->

<div class="detail-overlay" id="detail-overlay" onclick="closeDetailOnBg(event)">
  <div class="detail-sheet" id="detail-sheet">
    <!-- 戻るボタン付きヘッダー -->
    <div class="detail-header">
      <button class="detail-back-btn" onclick="closeDetail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        一覧に戻る
      </button>
      <div class="detail-handle"></div>
      <div style="width:80px"></div><!-- バランス用スペーサー -->
    </div>
    <div id="detail-img-wrap"></div>
    <div class="detail-body">
      <div id="detail-cat-badge" class="detail-cat-badge"></div>
      <div id="detail-title" class="detail-title"></div>
      <div id="detail-address" class="detail-address"></div>
      <div id="detail-date" class="detail-date"></div>
      <div class="detail-actions">
        <button class="like-btn" id="like-btn" onclick="toggleLike()">
          ❤️ <span id="like-count">0</span> いいね

async function toggleLike() {
  if (!currentRecord) return;
  const key   = currentRecord.date + currentRecord.lat;
  const liked = !!likedIds[key];
  const btn   = document.getElementById('like-btn');
  const cnt   = document.getElementById('like-count');

  if (liked) {
    delete likedIds[key];
    currentRecord.likes = Math.max(0, (currentRecord.likes || 1) - 1);
    btn.className = 'like-btn';
  } else {
    likedIds[key] = true;
    currentRecord.likes = (currentRecord.likes || 0) + 1;
    btn.className = 'like-btn liked';
    btn.style.transform = 'scale(1.15)';
    setTimeout(() => btn.style.transform = '', 200);
  }

  cnt.textContent = currentRecord.likes;

  try {
    await fetch(GAS_URL, {

      mode:    'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        formType:   'chiiki_like',

        lat:        currentRecord.lat,
        liked:      !liked

async function submitChiikiPost() {
  const category    = document.getElementById('submit-category').value;
  const titleVal    = document.getElementById('submit-title').value.trim();
  const imageFile   = document.getElementById('submit-image').files[0];
  const submitBtn   = document.getElementById('submit-btn');
  const statusEl    = document.getElementById('submit-status');

  if (!category) {
    statusEl.textContent = '⚠️ カテゴリを選択してください';
    statusEl.style.color = '#e74c3c';
    return;
  }

  submitBtn.disabled   = true;
  // ★ デバッグ：LIFF状態を表示
  statusEl.textContent = '🔍 LIFF確認中... userId=' + (liffUserId || '未取得');
  statusEl.style.color = '#249496';

  // ★ LIFFが未初期化の場合は再試行
  if (!liffReady || !liffUserId) {
    try {
      statusEl.textContent = '🔄 LIFF再初期化中...';
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile   = await liff.getProfile();
        liffUserId      = profile.userId;
        liffDisplayName = profile.displayName;
        liffReady       = true;
        statusEl.textContent = '✅ LIFF初期化完了: ' + liffDisplayName;
      } else {
        statusEl.textContent = '⚠️ LINEログインが必要です';
        statusEl.style.color = '#e74c3c';
        submitBtn.disabled   = false;
        liff.login();
        return;
      }
    } catch(liffErr) {
      statusEl.textContent = '⚠️ LIFF初期化失敗: ' + liffErr.message;
      statusEl.style.color = '#e74c3c';
      submitBtn.disabled   = false;
      return;
    }
  }

  statusEl.textContent = '📍 位置情報を取得中...';
  statusEl.style.color = '#249496';

  // 位置情報取得
  let lat = 0, lng = 0, address = '';
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true, timeout: 10000
      });
    });
    lat = pos.coords.latitude;
    lng = pos.coords.longitude;

    // 逆ジオコーディング（住所取得）
    try {
      const geoRes  = await fetch(
        `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&language=ja&key=${MAPS_API_KEY}`
      );
      const geoJson = await geoRes.json();
      if (geoJson.results && geoJson.results[0]) {
        address = geoJson.results[0].formatted_address;
      }
    } catch(ge) { console.warn('逆ジオコーディング失敗:', ge); }

  } catch(e) {
    statusEl.textContent = '⚠️ 位置情報の取得に失敗しました。設定で位置情報を許可してください。';
    statusEl.style.color = '#e74c3c';
    submitBtn.disabled   = false;
    return;
  }

  // 画像処理（カメラまたはアルバムから選択された場合）
  const imageFileCamera = document.getElementById('submit-image').files[0];
  const imageFileAlbum  = document.getElementById('submit-image-album').files[0];
  const imageFile       = imageFileCamera || imageFileAlbum;
  let imageBase64 = '';
  let imageMime   = '';
  if (imageFile) {
    statusEl.textContent = '🖼️ 画像を圧縮中...';
    try {
      const result  = await compressImage(imageFile, 800, 0.65);
      imageBase64   = result.base64;
      imageMime     = result.mime;
    } catch(e) {
      console.warn('画像圧縮エラー:', e);
    }
  }

  statusEl.textContent = '📤 投稿中...';

  // ── 投稿データをFormDataでPOST（iOS LINEブラウザ対応）
  try {
    const payload = JSON.stringify({
      formType:    'chiiki_post',
      category:    category,
      title:       titleVal || category,
      lat:         lat,
      lng:         lng,
      address:     address,
      userId:      liffUserId,
      displayName: liffDisplayName,
      imageBase64: imageBase64,
      imageMime:   imageMime
    });

    // FormDataにJSONを包んで送信（Content-Typeをmultipartにしてプリフライトを回避）
    const formData = new FormData();
    formData.append('data', payload);

    const res = await fetch(GAS_URL, {
      method: 'POST',
      body:   formData
    });

    let json;
    try {
      json = await res.json();
    } catch(e) {
      // レスポンスが読めない場合は成功とみなす
      json = { status: 'success' };
    }

    if (json.status === 'success') {
      statusEl.textContent = '✅ 投稿完了！フィードに反映されます😊';
      statusEl.style.color = '#27AE60';
      document.getElementById('submit-title').value = '';
      clearImage();
      document.getElementById('submit-category').value = '';
      document.querySelectorAll('.submit-cat-btn').forEach(b => b.classList.remove('selected'));
      setTimeout(async () => {
        closePostModal();
        await loadData();
      }, 2500);
    } else {
      throw new Error(json.message || '送信エラー');
    }
  } catch(e) {
    statusEl.textContent = '❌ エラー: ' + e.message;
    statusEl.style.color = '#e74c3c';
    console.error('投稿エラー:', e);
  }

  submitBtn.disabled = false;
}

// 画像圧縮（Canvas使用）
// ==========================================
function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width  = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl  = canvas.toDataURL('image/jpeg', quality);
        const base64   = dataUrl.split(',')[1];
        resolve({ base64: base64, mime: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 画像プレビュー（カメラ・アルバム共通）
function onImageSelected(input) {
  const preview     = document.getElementById('submit-preview');
  const previewWrap = document.getElementById('submit-preview-wrap');

    reader.onload = function(e) {
      preview.src            = e.target.result;
      previewWrap.style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
    // もう一方のinputをリセット（同時選択を防ぐ）
    if (input.id === 'submit-image') {
      document.getElementById('submit-image-album').value = '';
    } else {
      document.getElementById('submit-image').value = '';
    }
  }
}
