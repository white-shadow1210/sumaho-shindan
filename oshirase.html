<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>街のお知らせ | 吉田町まちなかLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --primary:   #249496;
  --primary-d: #1b7a7c;
  --navy:      #0f1f2e;
  --beige:     #FCFAF5;
  --beige-d:   #f0ece0;
  --white:     #ffffff;
  --text:      #1a1a1a;
  --muted:     #8a8a8a;
  --border:    rgba(0,0,0,0.08);
  --r:         16px;
  --col-event:   #9B59B6;
  --col-news:    #249496;
  --col-shop:    #e8850a;
  --col-welfare: #27AE60;
  --col-alert:   #E74C3C;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--beige); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

.app-header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; z-index: 100; }
.app-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--primary); letter-spacing: -0.03em; }
.app-logo span { color: var(--navy); }
.header-subtitle { font-size: 0.58rem; color: var(--muted); position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.header-refresh { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 8px; }

.cat-filter { display: flex; gap: 7px; padding: 10px 14px; overflow-x: auto; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; scrollbar-width: none; }
.cat-filter::-webkit-scrollbar { display: none; }
.cat-pill { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border); background: var(--beige); color: var(--muted); transition: 0.18s; white-space: nowrap; }
.cat-pill.active { color: white; border-color: transparent; }
.cat-pill[data-cat="all"].active      { background: var(--navy); }
.cat-pill[data-cat="event"].active    { background: var(--col-event); }
.cat-pill[data-cat="news"].active     { background: var(--col-news); }
.cat-pill[data-cat="shop"].active     { background: var(--col-shop); }
.cat-pill[data-cat="welfare"].active  { background: var(--col-welfare); }
.cat-pill[data-cat="alert"].active    { background: var(--col-alert); }

.main-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }

.loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; color: var(--muted); font-size: 0.82rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--beige-d); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.news-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.news-cat-bar {
  width: 4px;
  border-radius: 4px;
  flex-shrink: 0;
  align-self: stretch;
  min-height: 50px;
}

.news-body { flex: 1; min-width: 0; }
.news-link-area { 
  display: block; 
  text-decoration: none; 
  color: inherit; 
  cursor: pointer; 
}
.news-link-area:active { opacity: 0.85; }

.news-source-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
.news-source-icon { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--beige-d); }
.news-source-name { font-size: 0.65rem; color: var(--muted); font-weight: 700; }
.news-cat-badge { font-size: 0.6rem; font-weight: 700; color: white; padding: 1px 7px; border-radius: 10px; }

/* ★ v3: 「今度の◯日後」バッジ */
.news-soon-badge {
  font-size: 0.6rem;
  font-weight: 700;
  background: #fff3e0;
  color: #e65100;
  padding: 1px 7px;
  border-radius: 10px;
  border: 1px solid #ffcc80;
}
.news-soon-badge.urgent {
  background: #ffebee;
  color: #c62828;
  border-color: #ef9a9a;
}

.news-title { font-size: 0.9rem; font-weight: 700; line-height: 1.4; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-desc  { font-size: 0.72rem; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }

/* ★ v3: 日付表示エリア */
.news-date-area {
  font-size: 0.7rem;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.news-date-main {
  font-weight: 700;
}
.news-date-sub {
  font-size: 0.62rem;
  color: var(--muted);
}

.reaction-row {
  display: flex;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.reaction-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--beige);
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: 0.18s;
  user-select: none;
}
.reaction-btn:active { transform: scale(0.95); }
.reaction-btn .reaction-icon { font-size: 0.9rem; }
.reaction-btn .reaction-count { 
  font-size: 0.7rem; 
  color: var(--muted); 
  font-weight: 700; 
  background: var(--beige-d); 
  padding: 1px 6px; 
  border-radius: 8px; 
  min-width: 18px; 
  text-align: center; 
}
.reaction-btn.active.interest {
  background: #fff0f0;
  color: #e74c3c;
  border-color: #f5c0c0;
}
.reaction-btn.active.interest .reaction-count {
  background: #fad7d7;
  color: #e74c3c;
}
.reaction-btn.active.helpful {
  background: #e8f7ee;
  color: #27AE60;
  border-color: #b8e0c5;
}
.reaction-btn.active.helpful .reaction-count {
  background: #d2ecdb;
  color: #27AE60;
}
.reaction-btn.pulsing {
  animation: reactionPulse 0.4s ease;
}
@keyframes reactionPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}

.last-updated { text-align: center; font-size: 0.65rem; color: var(--muted); padding: 8px 0; }

.empty-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 10px; color: var(--muted); text-align: center; }
.empty-icon { font-size: 2.5rem; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">街の<span>お知らせ</span></div>
  <div class="header-subtitle">吉田町・牧之原市エリア</div>
  <button class="header-refresh" onclick="loadNews(true)" title="更新">🔄</button>
</header>

<div class="cat-filter">
  <div class="cat-pill active" data-cat="all"     onclick="filterNews('all')">📋 すべて</div>
  <div class="cat-pill"        data-cat="event"   onclick="filterNews('event')">🎉 イベント</div>
  <div class="cat-pill"        data-cat="news"    onclick="filterNews('news')">📰 行政・広報</div>
  <div class="cat-pill"        data-cat="shop"    onclick="filterNews('shop')">🛍️ お店情報</div>
  <div class="cat-pill"        data-cat="welfare" onclick="filterNews('welfare')">💚 福祉・健康</div>
  <div class="cat-pill"        data-cat="alert"   onclick="filterNews('alert')">⚠️ 防災・緊急</div>
</div>

<div class="main-scroll" id="main-scroll">
  <div class="loading-wrap"><div class="spinner"></div><div>お知らせを読み込み中...</div></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyX_iaLnrh8BCCCjsqWT5m3KRmUDzHPaxqtMhXJcOc9Ws9t252VmVPxWEOvMP5BskU/exec';
const LIFF_ID = '2009944467-lN8yixTk';

const CAT_COLOR = {
  event:   '#9B59B6',
  news:    '#249496',
  shop:    '#e8850a',
  welfare: '#27AE60',
  alert:   '#E74C3C',
  other:   '#8a8a8a'
};
const CAT_LABEL = {
  event:   '🎉 イベント',
  news:    '📰 行政',
  shop:    '🛍️ お店',
  welfare: '💚 福祉',
  alert:   '⚠️ 防災',
  other:   '📋 その他'
};

// ★ v3: 投稿日を表示するカテゴリ（行政・福祉・防災は時系列重視）
const SHOW_PUB_DATE = ['news', 'welfare', 'alert'];
// 開催日を表示するカテゴリ（イベント・お店は開催日重視）
const SHOW_EVENT_DATE = ['event', 'shop'];

let allNews = [], currentCat = 'all';
let reactedItems = JSON.parse(localStorage.getItem('oshirase_reactions') || '{}');
let liffUserId = '', liffReady = false;

async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      liffUserId = profile.userId;
      liffReady = true;
      console.log('[LIFF oshirase] 初期化完了:', profile.displayName);
    }
  } catch(e) {
    console.warn('[LIFF oshirase] 初期化エラー:', e);
  }
}
initLiff();

async function loadNews(forceRefresh = false) {
  const wrap = document.getElementById('main-scroll');
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><div>お知らせを読み込み中...</div></div>';

  try {
    const t   = forceRefresh ? Date.now() : Math.floor(Date.now() / (6*60*1000)) * (6*60*1000);
    const url = GAS_URL + '?action=getOshiraseData&t=' + t;
    const res  = await fetch(url);
    const json = JSON.parse(await res.text());
    if (json.status !== 'success') throw new Error(json.message || 'error');
    allNews = json.items || [];
    renderNews();
  } catch(e) {
    wrap.innerHTML = `
      <div class="empty-wrap">
        <div class="empty-icon">📡</div>
        <p>お知らせを取得できませんでした</p>
        <p style="font-size:0.7rem;color:#e74c3c;">${e.message}</p>
        <button onclick="loadNews(true)" style="margin-top:12px;padding:8px 20px;background:var(--primary);color:white;border:none;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">再試行</button>
      </div>`;
  }
}

function filterNews(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  document.querySelector(`.cat-pill[data-cat="${cat}"]`).classList.add('active');
  renderNews();
}

function getReactionKey(item) {
  return (item.pubDate || '') + '|' + (item.title || '');
}

// ============================================================
// ★ v3: タイトルから開催日を抽出する関数
// 例：「5月17日(日)」「8月23日（日）開催予定」→ Dateオブジェクト
// ============================================================
function extractEventDate(item) {
  const text = (item.title || '') + ' ' + (item.description || '');
  const now = new Date();
  const currentYear = now.getFullYear();
  
  // パターン1: 「M月D日」「M月D日(曜日)」「M月D日（曜日）」
  const match = text.match(/(\d{1,2})月(\d{1,2})日/);
  if (match) {
    const month = parseInt(match[1]);
    const day = parseInt(match[2]);
    let year = currentYear;
    
    // 過去の日付なら来年と判定
    const candidate = new Date(year, month - 1, day);
    if (candidate < now && (now - candidate) > (1000 * 60 * 60 * 24 * 30)) {
      // 30日以上前なら来年扱い
      year = currentYear + 1;
    }
    return new Date(year, month - 1, day);
  }
  
  // パターン2: 「YYYY-MM-DD」
  const match2 = text.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (match2) {
    return new Date(parseInt(match2[1]), parseInt(match2[2]) - 1, parseInt(match2[3]));
  }
  
  return null;
}

// ============================================================
// ★ v3: 開催日までの日数バッジ
// ============================================================
function getDaysUntilBadge(eventDate) {
  if (!eventDate) return '';
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const target = new Date(eventDate);
  target.setHours(0, 0, 0, 0);
  const diffDays = Math.floor((target - now) / (1000 * 60 * 60 * 24));
  
  if (diffDays < 0) return ''; // 過去
  if (diffDays === 0) return '<span class="news-soon-badge urgent">🔥 本日開催</span>';
  if (diffDays === 1) return '<span class="news-soon-badge urgent">🔥 明日開催</span>';
  if (diffDays <= 3) return `<span class="news-soon-badge urgent">⏰ あと${diffDays}日</span>`;
  if (diffDays <= 7) return `<span class="news-soon-badge">📅 あと${diffDays}日</span>`;
  if (diffDays <= 30) return `<span class="news-soon-badge">📅 今月開催</span>`;
  return '';
}

// ============================================================
// ★ v3: ソート関数
// イベント・お店：開催日が近い順
// ニュース・福祉・防災：投稿日新しい順
// ============================================================
function sortNews(news) {
  const now = new Date();
  
  // 各アイテムに開催日情報を付与
  const enriched = news.map(item => {
    const eventDate = SHOW_EVENT_DATE.includes(item.category) ? extractEventDate(item) : null;
    return { ...item, _eventDate: eventDate };
  });
  
  // 過ぎたイベントは除外
  const filtered = enriched.filter(item => {
    if (SHOW_EVENT_DATE.includes(item.category) && item._eventDate) {
      const target = new Date(item._eventDate);
      target.setHours(23, 59, 59, 999);
      if (target < now) return false; // 開催日終了済み
    }
    return true;
  });
  
  // カテゴリ別ソートロジック
  return filtered.sort((a, b) => {
    const aIsEvent = SHOW_EVENT_DATE.includes(a.category);
    const bIsEvent = SHOW_EVENT_DATE.includes(b.category);
    
    // 両方イベント系 → 開催日近い順
    if (aIsEvent && bIsEvent) {
      const aDate = a._eventDate || new Date(8640000000000000);
      const bDate = b._eventDate || new Date(8640000000000000);
      return aDate - bDate;
    }
    
    // 両方ニュース系 → 投稿日新しい順
    if (!aIsEvent && !bIsEvent) {
      return new Date(b.pubDate || 0) - new Date(a.pubDate || 0);
    }
    
    // 混在の場合：1週間以内のイベントは最優先で上に
    if (aIsEvent && a._eventDate) {
      const aDiff = (a._eventDate - now) / (1000 * 60 * 60 * 24);
      if (aDiff >= 0 && aDiff <= 7) return -1;
    }
    if (bIsEvent && b._eventDate) {
      const bDiff = (b._eventDate - now) / (1000 * 60 * 60 * 24);
      if (bDiff >= 0 && bDiff <= 7) return 1;
    }
    
    // その他は投稿日新しい順
    return new Date(b.pubDate || 0) - new Date(a.pubDate || 0);
  });
}

function renderNews() {
  const wrap    = document.getElementById('main-scroll');
  const baseList = currentCat === 'all' ? allNews : allNews.filter(n => n.category === currentCat);
  const filtered = sortNews(baseList);

  if (filtered.length === 0) {
    wrap.innerHTML = `
      <div class="empty-wrap">
        <div class="empty-icon">📭</div>
        <p>このカテゴリのお知らせはまだありません</p>
      </div>`;
    return;
  }

  const cards = filtered.map((item, idx) => {
    const color = CAT_COLOR[item.category] || CAT_COLOR.other;
    const label = CAT_LABEL[item.category] || CAT_LABEL.other;
    const iconHtml = item.sourceIcon
      ? `<img class="news-source-icon" src="${item.sourceIcon}" alt="" onerror="this.style.display='none'">`
      : `<div class="news-source-icon" style="background:${color};border-radius:4px;"></div>`;

    // ★ v3: 日付表示ロジック
    let dateHtml = '';
    if (SHOW_EVENT_DATE.includes(item.category)) {
      // イベント・お店：開催日のみ表示 + 残り日数バッジ
      const soonBadge = getDaysUntilBadge(item._eventDate);
      dateHtml = soonBadge ? `<div class="news-date-area">${soonBadge}</div>` : '';
    } else {
      // ニュース・福祉・防災：投稿日のみ表示
      if (item.pubDate) {
        const d = new Date(item.pubDate);
        const dateStr = d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });
        dateHtml = `<div class="news-date-area"><span class="news-date-sub">📅 ${dateStr} 配信</span></div>`;
      }
    }

    const key = getReactionKey(item);
    const myReactions = reactedItems[key] || {};
    const interestCount = item.interestCount || 0;
    const helpfulCount  = item.helpfulCount || 0;
    
    return `<div class="news-card">
      <div class="news-cat-bar" style="background:${color};"></div>
      <div class="news-body">
        <a class="news-link-area" href="${item.link || '#'}" target="_blank" rel="noopener">
          <div class="news-source-row">
            ${iconHtml}
            <span class="news-source-name">${item.sourceName || ''}</span>
            <span class="news-cat-badge" style="background:${color};">${label}</span>
          </div>
          <div class="news-title">${item.title || ''}</div>
          ${item.description ? `<div class="news-desc">${item.description}</div>` : ''}
          ${dateHtml}
        </a>
        <div class="reaction-row">
          <button class="reaction-btn interest ${myReactions.interest ? 'active' : ''}" 
                  id="react-interest-${idx}" 
                  onclick="toggleReaction(${idx}, 'interest')">
            <span class="reaction-icon">❤️</span>
            <span>興味あり</span>
            <span class="reaction-count" id="count-interest-${idx}">${interestCount}</span>
          </button>
          <button class="reaction-btn helpful ${myReactions.helpful ? 'active' : ''}" 
                  id="react-helpful-${idx}" 
                  onclick="toggleReaction(${idx}, 'helpful')">
            <span class="reaction-icon">👀</span>
            <span>参考になった</span>
            <span class="reaction-count" id="count-helpful-${idx}">${helpfulCount}</span>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  const updatedAt = allNews.length > 0 ? '最終更新：' + new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';
  wrap.innerHTML = `${cards}<div class="last-updated">${updatedAt}</div>`;
}

// ============================================================
// リアクション処理（変更なし）
// ============================================================
async function toggleReaction(idx, reactionType) {
  const baseList = currentCat === 'all' ? allNews : allNews.filter(n => n.category === currentCat);
  const filtered = sortNews(baseList);
  const item = filtered[idx];
  if (!item) return;

  const key = getReactionKey(item);
  if (!reactedItems[key]) reactedItems[key] = {};
  
  const isActive = !!reactedItems[key][reactionType];
  const btn = document.getElementById(`react-${reactionType}-${idx}`);
  const countEl = document.getElementById(`count-${reactionType}-${idx}`);
  
  btn.classList.add('pulsing');
  setTimeout(() => btn.classList.remove('pulsing'), 400);

  let newCount = parseInt(countEl.textContent || 0);
  if (isActive) {
    delete reactedItems[key][reactionType];
    btn.classList.remove('active');
    newCount = Math.max(0, newCount - 1);
  } else {
    reactedItems[key][reactionType] = true;
    btn.classList.add('active');
    newCount = newCount + 1;
  }
  countEl.textContent = newCount;
  localStorage.setItem('oshirase_reactions', JSON.stringify(reactedItems));

  try {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        formType: 'oshirase_reaction',
        pubDate: item.pubDate,
        title: item.title,
        reactionType: reactionType,
        userId: liffUserId || '',
        action: isActive ? 'remove' : 'add'
      })
    });
  } catch(e) {
    console.warn('リアクション送信エラー:', e);
  }
}

loadNews();
</script>

</body>
</html>
