<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE登録ページ - スマホの相談士</title>
<style>
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #f4f7f6 0%, #e8f7f7 100%);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    max-width: 380px;
    width: 90%;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #249496, #82c4c3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #fff;
  }
  h1 {
    font-size: 1.3rem;
    color: #1a2a40;
    margin-bottom: 12px;
    font-weight: 700;
  }
  .lead {
    color: #5a6878;
    font-size: 0.95rem;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .loader {
    margin: 16px auto;
    width: 40px;
    height: 40px;
    border: 4px solid #e8f7f7;
    border-top-color: #249496;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .status {
    color: #249496;
    font-size: 0.85rem;
    margin-top: 16px;
  }
  .manual-btn {
    margin-top: 24px;
    display: inline-block;
    background: #06c755;
    color: #fff;
    padding: 14px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 4px 12px rgba(6,199,85,0.3);
  }
  .note {
    margin-top: 16px;
    font-size: 0.75rem;
    color: #999;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📱</div>
  <h1>LINE登録ページへ移動中</h1>
  <p class="lead">スマホの相談士の<br>公式LINEへ移動しています...</p>
  <div class="loader"></div>
  <div class="status" id="status">準備中...</div>
  <a id="manual-link" class="manual-btn" href="https://lin.ee/nnXrMes" style="display:none;">
    LINEに友だち追加する
  </a>
  <p class="note">自動で移動しない場合は上のボタンをタップしてください</p>
</div>

<script>
(function() {
  // === 1. URLから src を取得 ===
  function getSrc() {
    try {
      var url = new URL(window.location.href);
      var src = url.searchParams.get('src');
      if (src) {
        return src.replace(/[^a-zA-Z0-9_-]/g, '').substring(0, 50);
      }
    } catch(e) {}
    return null;
  }

  // === 2. srcを複数の場所に保存 ===
  // (LINE経由でブラウザが変わるため、Cookie / localStorage / sessionStorage 3層保存)
  function saveSrc(src) {
    if (!src) return;

    // Cookie保存(同一ドメイン用、30日有効)
    try {
      var date = new Date();
      date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000));
      document.cookie = 'sumaho_src=' + encodeURIComponent(src) +
                        '; expires=' + date.toUTCString() +
                        '; path=/; SameSite=Lax';
    } catch(e) { console.warn('Cookie保存失敗', e); }

    // localStorage保存
    try { localStorage.setItem('sumaho_src', src); } catch(e) {}

    // sessionStorage保存
    try { sessionStorage.setItem('sumaho_src', src); } catch(e) {}
  }

  // === 3. 処理開始 ===
  var src = getSrc();
  var statusEl = document.getElementById('status');
  var manualBtn = document.getElementById('manual-link');

  if (src) {
    saveSrc(src);
    statusEl.textContent = '流入経路を記録しました: ' + src;
    console.log('[r.html] src=' + src);
  } else {
    statusEl.textContent = '通常アクセス';
  }

  // === 4. LINE公式アカウントへリダイレクト(0.8秒後) ===
  // ↓ ここは西舘さんの公式LINE URLに変更してください
  var LINE_URL = 'https://lin.ee/nnXrMes';
  // または: 'https://line.me/R/ti/p/@281jfkpu'

  setTimeout(function() {
    statusEl.textContent = 'LINEへ移動します...';
    manualBtn.style.display = 'inline-block';
    manualBtn.href = LINE_URL;
    window.location.href = LINE_URL;
  }, 800);

  // === 5. フォールバック(3秒後にもまだいたら手動ボタンを目立たせる) ===
  setTimeout(function() {
    statusEl.textContent = '自動で移動しない場合は下のボタンをタップ';
    manualBtn.style.animation = 'pulse 1s infinite';
  }, 3000);
})();
</script>
</body>
</html>
