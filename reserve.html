<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホの相談士 - 予約フォーム</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary-blue: #249496;
            --primary-hover: #1b7a7c;
            --accent-orange: #f39c12;
            --bg-beige: #FCFAF5;
            --text-main: #333333;
            --border-color: #ddd;
            --step-bg: #f4f4f4;
            --member-gold: #cba052;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-beige);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
            position: relative;
        }

        #returning-banner {
            display: none;
            background: #fff3e0;
            border-bottom: 2px solid var(--accent-orange);
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #d35400;
            line-height: 1.4;
        }

        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary-blue);
            letter-spacing: 1px;
        }

        .step-nav {
            display: flex;
            background: var(--step-bg);
            border-bottom: 2px solid var(--border-color);
        }
        .step-item {
            flex: 1;
            text-align: center;
            padding: 15px 5px;
            font-size: 0.9rem;
            color: #888;
            position: relative;
            font-weight: bold;
        }
        .step-item.active { background: var(--primary-blue); color: #fff; }
        .step-item:not(:last-child)::after {
            content: ''; position: absolute; top: 0; right: -15px;
            border-top: 25px solid transparent; border-bottom: 25px solid transparent;
            border-left: 15px solid var(--step-bg); z-index: 1;
        }
        .step-item.active::after { border-left-color: var(--primary-blue); z-index: 2; }

        .form-section { display: none; padding: 30px 20px; animation: fadeIn 0.3s; }
        .form-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title {
            font-size: 1.2rem; margin-top: 0; margin-bottom: 20px;
            border-left: 4px solid var(--primary-blue); padding-left: 10px;
        }

        .subscriber-login {
            background: #e8f5f5; padding: 15px; border-radius: 8px;
            margin-bottom: 25px; text-align: center; border: 1px solid #bce0e0;
        }
        .btn-line { background: #06C755; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .member-mode .subscriber-login { background: #fdfaf2; border-color: var(--member-gold); }
        .member-mode .header h1, .member-mode .section-title { color: var(--member-gold); }
        .member-mode .step-item.active { background: var(--member-gold); }
        .member-mode .step-item.active::after { border-left-color: var(--member-gold); }

        .menu-card {
            border: 2px solid var(--border-color); border-radius: 8px; padding: 15px;
            margin-bottom: 15px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .menu-card:hover { border-color: var(--primary-blue); background: #f0f8f8; }
        .menu-card input[type="radio"] { transform: scale(1.5); margin-right: 15px; accent-color: var(--primary-blue); }
        .menu-content { flex: 1; }
        .menu-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .menu-desc { font-size: 0.85rem; color: #666; }
        .subs-upsell { font-size: 0.75rem; color: #e74c3c; margin-top: 5px; display: inline-block; background: #fdf0ed; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .member-mode .subs-upsell { display: none; }
        .menu-price { font-weight: bold; color: var(--primary-blue); text-align: right; min-width: 90px; }
        .member-mode .menu-price { color: var(--member-gold); }
        .price-original { display: none; text-decoration: line-through; color: #999; font-size: 0.8rem; }
        .member-mode .price-original { display: block; }

        .calendar-wrap { overflow-x: auto; margin-bottom: 20px; border: 1px solid var(--border-color); border-radius: 8px; }
        .calendar-table { width: 100%; border-collapse: collapse; min-width: 1000px; background: #fff; table-layout: fixed; }
        .calendar-table th, .calendar-table td { border: 1px solid var(--border-color); text-align: center; padding: 12px 5px; }
        .time-slot { background: #f9f9f9; font-weight: bold; position: sticky; left: 0; z-index: 10; border-right: 2px solid var(--border-color); }
        .slot-available { color: var(--accent-orange); font-size: 1.2rem; cursor: pointer; }
        .slot-selected { background: var(--accent-orange) !important; color: #fff !important; }
        .slot-blocked { background: #fcdfb6 !important; color: #d35400 !important; }

        .summary-box { background: #fdfdfd; border: 1px solid var(--border-color); padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .total-price-row { font-size: 1.2rem; font-weight: bold; color: var(--primary-blue); border-top: 2px solid var(--border-color); padding-top: 15px; }
        .member-mode .total-price-row { color: var(--member-gold); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 5px; box-sizing: border-box; }

        .bottom-nav { display: flex; justify-content: space-between; padding: 20px; background: #fff; border-top: 1px solid var(--border-color); position: sticky; bottom: 0; }
        .btn { padding: 12px 25px; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; border: none; }
        .btn-back { background: #fff; border: 1px solid #ccc; }
        .btn-next { background: var(--accent-orange); color: #fff; flex-grow: 1; margin-left: 15px; }

        #sending-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 42, 64, 0.88); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
        }
        #sending-overlay.active { display: flex; }
        .sending-card { background: #fff; border-radius: 24px; padding: 40px; text-align: center; width: 80%; max-width: 300px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sending-overlay">
    <div class="sending-card">
        <div class="spinner" id="overlay-spinner"></div>
        <div class="sending-title">予約を送信中です</div>
        <div class="sending-sub">少々お待ちください</div>
    </div>
</div>

<div class="container" id="app-container">
    <div id="returning-banner"></div>
    <div class="header">
        <h1>MOBILE PLANNING<br>スマホの相談士</h1>
    </div>

    <div class="step-nav">
        <div class="step-item active" id="nav-step1">メニューを選択</div>
        <div class="step-item" id="nav-step2">日時を指定</div>
        <div class="step-item" id="nav-step3">情報入力・確認</div>
    </div>

    <div id="step1" class="form-section active">
        <div class="subscriber-login" id="login-box">
            <p><strong>すでにサブスク会員（かかりつけ登録）の方はこちら</strong></p>
            <button class="btn-line" type="button" onclick="tryMemberLogin()">パスワード入力</button>
        </div>

        <h2 class="section-title">ご希望のメニュー</h2>
        <label class="menu-card" onclick="selectMenu('menu1', 'スマホ健康診断', 0, 30)">
            <input type="radio" name="menu" id="menu1">
            <div class="menu-content"><div class="menu-title">スマホ健康診断（まずは無料診断）</div><div class="menu-desc">料金プランの見直し等、現状のカルテを作成します。</div></div>
            <div class="menu-price">¥0<br><small>(30分)</small></div>
        </label>
        <label class="menu-card" onclick="selectMenu('menu2', 'スマホ整理・お悩み相談', 3300, 60)">
            <input type="radio" name="menu" id="menu2">
            <div class="menu-content"><div class="menu-title">スマホ整理・お悩み相談</div><div class="menu-desc">写真整理や操作方法の疑問などあらゆるお悩みを解決。</div><div class="subs-upsell">★サブスク会員様は20%割引！</div></div>
            <div class="menu-price"><span class="price-original">通常: ¥3,300</span><span class="price-display">¥3,300</span><br><small>(60分)</small></div>
        </label>
        <label class="menu-card" onclick="selectMenu('menu3', 'プラン見直し・最適化診断', 5500, 60)">
            <input type="radio" name="menu" id="menu3">
            <div class="menu-content"><div class="menu-title">プラン見直し・最適化診断</div><div class="menu-desc">各社比較し、最適な通信費削減をご提案。</div><div class="subs-upsell">★サブスク会員様は20%割引！</div></div>
            <div class="menu-price"><span class="price-original">通常: ¥5,500</span><span class="price-display">¥5,500</span><br><small>(60分)</small></div>
        </label>
        <label class="menu-card" onclick="selectMenu('menu4', '完全データ移行パック', 11000, 120)">
            <input type="radio" name="menu" id="menu4">
            <div class="menu-content"><div class="menu-title">完全データ移行パック</div><div class="menu-desc">機種変更時のデータ移行、LINE引継ぎ等を全て代行。</div><div class="subs-upsell">★サブスク会員様は20%割引！</div></div>
            <div class="menu-price"><span class="price-original">通常: ¥11,000</span><span class="price-display">¥11,000</span><br><small>(120分)</small></div>
        </label>
    </div>

    <div id="step2" class="form-section">
        <h2 class="section-title">日時の指定</h2>
        <div class="calendar-wrap">
            <table class="calendar-table">
                <thead id="calendar-head"></thead>
                <tbody id="calendar-body"></tbody>
            </table>
        </div>
    </div>

    <div id="step3" class="form-section">
        <h2 class="section-title">予約内容の確認</h2>
        <div class="summary-box">
            <div class="summary-item"><span>メニュー:</span><strong id="summary-menu"></strong></div>
            <div class="summary-item"><span>日時:</span><strong id="summary-datetime"></strong></div>
            <div class="total-price-row"><span>予定額:</span><strong id="summary-price"></strong></div>
        </div>
        <div class="form-group"><label>お名前<span>(必須)</span></label><input type="text" class="form-control" id="input-name" placeholder="例：山田 太郎"></div>
        <div class="form-group"><label>電話番号<span>(必須)</span></label><input type="tel" class="form-control" id="input-tel" placeholder="例：090-1234-5678"></div>
        <div class="form-group"><label>メールアドレス<span>(必須)</span></label><input type="email" class="form-control" id="input-email" placeholder="例：example@mail.com"></div>
        <label><input type="checkbox" id="check-promo"> 当日にサブスク会員の説明を聞きたい</label>
    </div>

    <div class="bottom-nav">
        <button class="btn btn-back" id="btn-back" style="display: none;" onclick="goBack()">戻る</button>
        <button class="btn btn-next" id="btn-next" onclick="goNext()">次へ (日時を指定)</button>
    </div>
</div>

<script>
    let currentStep = 1;
    let isMemberMode = false;
    let selected = { id: '', name: '', price: 0, duration: 0, dateRaw: '', time: '' };
    const START_MIN = 570, END_MIN = 1260, INTERVAL = 30;

    // ★重要：URLをバージョン30のものに修正・統一しました
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyMnBarQsfK7mdMqsZu98hbrzMvotafLsIfzn5V1HEv9l1QFQXOqXIY4EX4J-gyHno/exec";

    function selectMenu(menuId, name, basePrice, duration) {
        document.getElementById(menuId).checked = true;
        selected = { id: menuId, name: name, price: isMemberMode ? basePrice * 0.8 : basePrice, duration: duration };
    }

    async function generateCalendar() {
        const thead = document.getElementById('calendar-head');
        const tbody = document.getElementById('calendar-body');
        thead.innerHTML = '<tr><td>空き状況を読み込み中...</td></tr>';
        
        let busySet = new Set();
        try {
            const res = await fetch(GAS_URL);
            const json = await res.json();
            (json.busy || []).forEach(slot => {
                const start = new Date(slot.start);
                const end = new Date(slot.end);
                for (let t = new Date(start); t < end; t.setMinutes(t.getMinutes() + 30)) {
                    busySet.add(t.getFullYear() + "/" + (t.getMonth()+1) + "/" + t.getDate() + "_" + t.getHours() + ":" + String(t.getMinutes()).padStart(2,'0'));
                }
            });
        } catch(e) { console.error("Calendar load error"); }

        thead.innerHTML = ''; tbody.innerHTML = '';
        let trH = document.createElement('tr');
        trH.innerHTML = '<th class="time-slot">時間</th>';
        const days = [];
        const today = new Date();
        for(let i=1; i<=14; i++){
            let d = new Date(today); d.setDate(today.getDate()+i);
            days.push({raw: d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日", obj: d});
            trH.innerHTML += `<th>${d.getDate()}<br>(${(['日','月','火','水','木','金','土'])[d.getDay()]})</th>`;
        }
        thead.appendChild(trH);

        for(let tm=START_MIN; tm<=END_MIN; tm+=INTERVAL){
            let h = Math.floor(tm/60), m = tm%60;
            let tStr = h + ":" + (m===0?'00':'30');
            let tr = document.createElement('tr');
            tr.innerHTML = `<td class="time-slot">${tStr}</td>`;
            days.forEach(day => {
                let td = document.createElement('td');
                const key = day.obj.getFullYear() + "/" + (day.obj.getMonth()+1) + "/" + day.obj.getDate() + "_" + tStr;
                if(busySet.has(key)){ td.innerText = '×'; td.className = 'slot-full'; }
                else {
                    td.innerText = '◎'; td.className = 'slot-available';
                    td.onclick = () => {
                        document.querySelectorAll('.slot-available').forEach(el => el.classList.remove('slot-selected'));
                        td.classList.add('slot-selected');
                        selected.dateRaw = day.raw; selected.time = tStr;
                        document.getElementById('btn-next').innerText = '次へ (内容を確認)';
                    };
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }

    function goNext() {
        if(currentStep === 1 && !selected.id) return Swal.fire("確認", "メニューを選択してください", "warning");
        if(currentStep === 2 && !selected.dateRaw) return Swal.fire("確認", "日時を選択してください", "warning");
        if(currentStep === 3) return submitToGAS();
        currentStep++; updateNav();
    }
    function goBack() { currentStep--; updateNav(); }

    function updateNav() {
        document.querySelectorAll('.form-section').forEach((s, i) => s.classList.toggle('active', i+1 === currentStep));
        document.querySelectorAll('.step-item').forEach((s, i) => s.classList.toggle('active', i+1 === currentStep));
        document.getElementById('btn-back').style.display = currentStep > 1 ? 'block' : 'none';
        if(currentStep === 2) generateCalendar();
        if(currentStep === 3){
            document.getElementById('summary-menu').innerText = selected.name;
            document.getElementById('summary-datetime').innerText = selected.dateRaw + " " + selected.time + "〜";
            document.getElementById('summary-price').innerText = "¥" + selected.price.toLocaleString();
            document.getElementById('btn-next').innerText = 'この内容で予約を確定する';
        } else {
            document.getElementById('btn-next').innerText = currentStep === 1 ? '次へ (日時を指定)' : '日時を選択してください';
        }
    }

    function submitToGAS() {
        const name = document.getElementById('input-name').value;
        const tel = document.getElementById('input-tel').value;
        const email = document.getElementById('input-email').value;
        if(!name || !tel || !email) return Swal.fire("エラー", "必須項目を入力してください", "error");

        document.getElementById('sending-overlay').classList.add('active');
        const data = {
            name: name, tel: tel, email: email,
            menu: selected.name, date: selected.dateRaw, time: selected.time,
            price: selected.price, promoInfo: document.getElementById('check-promo').checked ? "希望" : "不要"
        };
        fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) })
        .then(() => {
            Swal.fire("予約完了", "ありがとうございます。確認メールをお送りします。", "success")
            .then(() => location.reload());
        }).catch(() => {
            Swal.fire("エラー", "送信に失敗しました。再試行してください。", "error");
            document.getElementById('sending-overlay').classList.remove('active');
        });
    }

    async function tryMemberLogin() {
        const { value: pass } = await Swal.fire({
            title: '会員ログイン',
            input: 'password',
            inputLabel: '4桁のパスワード',
            showCancelButton: true
        });
        if (pass === "1234") { // パスワードは仮です
            isMemberMode = true;
            document.getElementById('app-container').classList.add('member-mode');
            Swal.fire("認証成功", "会員価格を適用しました", "success");
        }
    }
</script>
</body>
</html>
